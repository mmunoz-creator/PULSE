<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PULSE Pricing</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
/* ============================================================
   TOKENS — captured from the live elevatorpulse.com app.
   This is an internal tool; layout/interaction patterns mirror
   production PULSE exactly per team direction.
   ============================================================ */
:root {
  --navy: #0a1628;
  --navy-2: #0d1b2e;
  --navy-card: #101f36;
  --blue: #2f6fed;
  --blue-dark: #1d54c4;
  --blue-pale: #eaf1fd;
  --purple: #4a3aa7;
  --purple-pale: #f1edfb;
  --mint: #2fd9a8;
  --mint-dark: #17b98c;
  --green: #1a8a4a;
  --green-pale: #e3f7ea;
  --amber: #8a5c00;
  --amber-pale: #fff3da;
  --red: #a32a2a;
  --red-pale: #fbe9e9;
  --gray-25: #fafafa;
  --gray-50: #f6f7f8;
  --gray-100: #eef0f2;
  --gray-200: #e3e6ea;
  --gray-300: #d0d5db;
  --gray-500: #8a919c;
  --text-primary: #14181f;
  --text-secondary: #4d5560;
  --text-muted: #8a919c;
  --border: #e3e6ea;
  --border-strong: #d0d5db;
  --radius: 10px;
  --radius-sm: 6px;
  --shadow-drawer: -8px 0 32px rgba(10,22,40,0.18);
  --shadow-modal: 0 12px 40px rgba(10,22,40,0.22);
  --font: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, Helvetica, Arial, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin:0; padding:0; }
body {
  font-family: var(--font);
  background: var(--gray-50);
  color: var(--text-primary);
  font-size: 13px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
.hidden { display: none !important; }

/* ============================================================
   LOGIN SCREEN — same approved design as the admin tool
   (personnel_admin.html / login_mockup.html): floating card on a dark
   particle-wave background. Real name+PIN auth against the live Worker
   -- no client-side-only role check. Sales and Admin share this one
   screen; role comes back from the server and decides what renders
   after sign-in, never a client-side toggle.
   ============================================================ */
#login-screen, #reset-pin-screen{
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  background:radial-gradient(ellipse at 20% 100%,#0d2b24 0%,#061020 55%,#04070d 100%);
  font-family:'Plus Jakarta Sans',-apple-system,sans-serif; position:relative; overflow:hidden; padding:24px;
}
#login-particles{position:absolute; inset:0; z-index:0;}
.login-card-outer{
  position:relative; z-index:1; display:flex; width:100%; max-width:900px; min-height:560px;
  background:white; border-radius:20px; overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,.5);
}
.login-hero{
  flex:0 0 44%; background:linear-gradient(165deg,#08251d 0%,#0d2b24 60%,#061020 100%);
  position:relative; overflow:hidden; padding:44px 38px; display:flex; flex-direction:column;
}
.login-hero-particles{position:absolute; inset:0; z-index:0;}
.login-hero-content{position:relative; z-index:1; display:flex; flex-direction:column; height:100%;}
.login-logo-row{display:flex; align-items:center; gap:10px;}
.login-logo-mark{width:34px; height:34px; flex-shrink:0;}
.login-wordmark{font-size:26px; font-weight:800; color:white; letter-spacing:-0.5px; line-height:1;}
.login-wordmark .accent{color:#2fd9a8;}
.login-hero-tagline{margin-top:auto; padding-top:40px;}
.login-hero-tagline h2{font-size:26px; font-weight:750; color:white; line-height:1.28; margin:0 0 14px; letter-spacing:-0.3px;}
.login-hero-tagline h2 .accent{color:#5eeac3;}
.login-form-side{flex:1; padding:48px 46px; display:flex; flex-direction:column; justify-content:center;}
.login-form-inner{width:100%; max-width:340px; margin:0 auto;}
.login-form-title{font-size:24px; font-weight:800; color:#14181f; margin:0 0 6px; letter-spacing:-0.4px;}
.login-form-sub{font-size:13px; color:#6b7280; margin:0 0 28px;}
.login-field-wrap{margin-bottom:16px;}
.login-field-label{font-size:11.5px; font-weight:700; color:#374151; display:block; margin-bottom:6px;}
input.login-styled{
  width:100%; padding:11px 13px; border:1px solid #e3e6ea; border-radius:9px; background:#fafafa;
  color:#14181f; font-size:13.5px; outline:none; transition:border .15s, background .15s; font-family:inherit;
}
input.login-styled:focus{border-color:#17b98c; box-shadow:0 0 0 3px rgba(23,185,140,.15); background:white;}
.login-btn{
  width:100%; padding:13px; margin-top:6px; background:linear-gradient(135deg,#0e9370,#2fd9a8); color:white;
  border:none; border-radius:9px; font-size:14.5px; font-weight:700; cursor:pointer; display:flex; align-items:center;
  justify-content:center; gap:8px; transition:all .2s; box-shadow:0 6px 20px rgba(23,185,140,.35);
  font-family:inherit;
}
.login-btn:hover{background:linear-gradient(135deg,#0c7d5f,#0e9370); box-shadow:0 8px 26px rgba(23,185,140,.45);}
.login-btn:disabled{opacity:.6; cursor:not-allowed;}
#login-error{display:none; color:#c0392b; font-size:12px; margin-top:8px; line-height:1.5;}
.login-footnote{font-size:11.5px; color:#9ca3af; margin-top:26px; text-align:center;}
@media(max-width:760px){.login-hero{display:none;} .login-card-outer{max-width:420px;} .login-form-side{padding:40px 30px;}}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; font-size: 13px; }
table { border-collapse: collapse; width: 100%; }

/* ============================================================
   APP SHELL
   ============================================================ */
.app-shell { display: flex; min-height: 100vh; }

.sidebar {
  width: 216px; flex-shrink: 0; background: var(--navy);
  display: flex; flex-direction: column;
  padding: 18px 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto;
  font-family: 'Plus Jakarta Sans', var(--font);
}
.sidebar-logo { display:flex; align-items:center; gap:9px; padding: 4px 6px 14px 6px; }
.sidebar-logo .mark {
  width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, var(--mint), var(--mint-dark));
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.sidebar-logo .mark svg { width:16px; height:16px; }
.sidebar-logo .word { color: white; font-weight: 800; font-size: 16px; letter-spacing: 0.2px; }
.sidebar-logo .word .seg { color: var(--mint); }

.role-pill {
  display:inline-block; margin: 4px 4px 16px 4px; padding: 2px 8px; font-size: 9.5px; font-weight: 700;
  letter-spacing: 0.5px; color: var(--blue); background: rgba(47,111,237,0.15); border-radius: 100px;
  width: fit-content;
}
.role-pill.is-admin { color: #ffb020; background: rgba(255,176,32,0.16); }

.nav-section-label {
  font-size: 10px; font-weight: 700; letter-spacing: 0.6px; color: rgba(255,255,255,0.32);
  padding: 14px 10px 6px 10px; text-transform: uppercase;
}
.nav-section-label:first-of-type { padding-top: 4px; }
.nav-item {
  display:flex; align-items:center; gap:10px; padding: 8px 10px; border-radius: 7px; margin-bottom: 1px;
  color: rgba(255,255,255,0.68); font-size: 12.5px; font-weight: 500; cursor:pointer; transition: background .1s;
}
.nav-item:hover { background: rgba(255,255,255,0.05); color: white; }
.nav-item.active { background: rgba(47,217,168,0.16); color: #a9f5e0; font-weight: 650; }
.nav-item .ic { width:18px; text-align:center; opacity:0.9; flex-shrink:0; font-size:17px; line-height:1; }
.nav-item .badge-count {
  margin-left:auto; background: var(--blue); color:white; font-size:9.5px; font-weight:700;
  border-radius: 100px; padding: 1px 6px; min-width:16px; text-align:center;
}

.sidebar-footer { margin-top: auto; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.08); }
.sidebar-user { display:flex; align-items:center; gap:9px; padding: 6px; }
.sidebar-user .avatar {
  width:30px; height:30px; border-radius:50%; background: var(--mint-dark); color:#06231b; font-weight:700;
  font-size:11px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.sidebar-user .who { line-height:1.3; }
.sidebar-user .name { color:white; font-size:12px; font-weight:650; }
.sidebar-user .role { color: rgba(255,255,255,0.45); font-size:10.5px; }
.sidebar-signout-btn {
  display:flex; align-items:center; gap:8px; width:100%; padding: 8px 12px; margin-top: 8px;
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 8px;
  color: rgba(255,255,255,0.75); font-size: 12px; font-weight: 600; cursor:pointer;
  font-family: inherit; transition: background .12s, border-color .12s, color .12s;
}
.sidebar-signout-btn:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.22); color: white; }
.sidebar-signout-btn i { font-size: 15px; flex-shrink:0; }
.sidebar-version { color: rgba(255,255,255,0.28); font-size: 10px; padding: 6px 6px 0 6px; letter-spacing: 0.3px; }

.main { flex:1; min-width:0; padding: 22px 30px 60px 30px; }

/* ============================================================
   PAGE HEADER / TITLE
   ============================================================ */
.page-topline { display:flex; align-items:center; gap:8px; color: var(--text-muted); font-size:11.5px; margin-bottom:4px; }
.page-header-row { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:18px; flex-wrap:wrap; }
.page-title { font-size: 21px; font-weight: 750; margin: 0 0 3px 0; letter-spacing:-0.2px; }
.page-sub { font-size: 12.5px; color: var(--text-muted); margin:0; }
.page-actions { display:flex; align-items:center; gap:8px; flex-shrink:0; }

/* ============================================================
   BUTTONS
   ============================================================ */
.btn {
  display:inline-flex; align-items:center; gap:6px; padding: 8px 14px; font-size: 12px; font-weight: 650;
  border-radius: 7px; border: 1px solid var(--border-strong); background: white; color: var(--text-primary);
  transition: all .12s;
}
.btn:hover { background: var(--gray-50); border-color: var(--gray-500); }
.btn-primary { background: var(--blue); border-color: var(--blue); color: white; }
.btn-primary:hover { background: var(--blue-dark); border-color: var(--blue-dark); }
.btn-green { background: var(--green); border-color: var(--green); color: white; }
.btn-green:hover { filter: brightness(0.92); }
.btn-danger { background:white; border-color: var(--red); color: var(--red); }
.btn-danger:hover { background: var(--red-pale); }
.btn-ghost { background: transparent; border-color: transparent; }
.btn-ghost:hover { background: var(--gray-100); }
.btn-sm { padding: 5px 10px; font-size: 11px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn:disabled:hover { background: white; border-color: var(--border-strong); }

/* ============================================================
   STAT TILES
   ============================================================ */
.stat-row { display:grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
.stat-row.cols-5 { grid-template-columns: repeat(5, 1fr); }
.stat-row.cols-6 { grid-template-columns: repeat(6, 1fr); }
.stat-tile {
  background:white; border:1px solid var(--border); border-radius: var(--radius); padding: 14px 16px;
  display:flex; flex-direction:column; gap: 4px;
}
.stat-tile .top-row { display:flex; align-items:center; justify-content:space-between; }
.stat-tile .label { font-size:11px; color: var(--text-muted); font-weight:600; }
.stat-tile .icon-chip {
  width:26px; height:26px; border-radius:7px; background: var(--blue-pale); color: var(--blue);
  display:flex; align-items:center; justify-content:center; font-size:12px; flex-shrink:0;
}
.stat-tile .value { font-size: 22px; font-weight: 750; letter-spacing:-0.3px; }
.stat-tile .caption { font-size: 10.5px; color: var(--text-muted); }
.stat-tile .caption.critical { color: var(--red); font-weight:600; }

/* ============================================================
   HELPER / NOTIONAL BANNERS
   ============================================================ */
.helper-banner {
  display:flex; gap:9px; align-items:flex-start; background: var(--blue-pale); color: var(--blue-dark);
  border: 1px solid #cddffb; border-radius: var(--radius-sm); padding: 10px 13px; font-size:12px; margin-bottom:14px;
}
.helper-banner .ic { flex-shrink:0; margin-top:1px; }
.notional-banner {
  display:flex; gap:9px; align-items:flex-start; background: var(--amber-pale); color: var(--amber);
  border: 1px solid #f2dfad; border-radius: var(--radius-sm); padding: 10px 13px; font-size:12px; margin-bottom:14px;
}
.notional-banner .ic { flex-shrink:0; margin-top:1px; }
.notional-banner b { color: inherit; }
.purple-banner {
  display:flex; gap:9px; align-items:flex-start; background: var(--purple-pale); color: var(--purple);
  border: 1px solid #ded7f7; border-radius: var(--radius-sm); padding: 10px 13px; font-size:12px; margin-bottom:14px;
}

/* ============================================================
   FILTER TABS + CHIPS
   ============================================================ */
.filter-tabs { display:flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 12px; flex-wrap:wrap; }
.filter-tab {
  padding: 8px 12px; font-size:12px; font-weight:600; color: var(--text-muted); border-bottom: 2px solid transparent;
  cursor:pointer; margin-bottom:-1px;
}
.filter-tab:hover { color: var(--text-primary); }
.filter-tab.active { color: var(--blue); border-bottom-color: var(--blue); }

.chip-row { display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; align-items:center; }
.chip {
  padding: 6px 12px; font-size:11.5px; font-weight:600; border-radius:100px; border:1px solid var(--border-strong);
  background:white; color: var(--text-secondary); cursor:pointer;
}
.chip.active { background: var(--navy); border-color: var(--navy); color:white; }
.chip:hover:not(.active) { background: var(--gray-50); }

.legend-row { display:flex; gap:14px; align-items:center; font-size:10.5px; color: var(--text-muted); margin: 0 0 10px 2px; flex-wrap:wrap; }
.legend-dot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:4px; vertical-align:middle; }

/* ============================================================
   TABLES
   ============================================================ */
.table-card { background:white; border:1px solid var(--border); border-radius: var(--radius); overflow:hidden; }
.table-scroll { overflow-x:auto; }
.data-table { font-size:12.5px; }
.data-table thead th {
  text-align:left; font-size:10.5px; font-weight:700; letter-spacing:0.3px; color: var(--text-muted);
  text-transform:uppercase; padding: 10px 14px; border-bottom:1px solid var(--border); white-space:nowrap;
  background: var(--gray-25);
}
.data-table thead th.num, .data-table td.num { text-align:right; }
.data-table thead th.sortable { cursor:pointer; }
.data-table thead th.sortable:hover { color: var(--text-primary); }
.data-table tbody td { padding: 11px 14px; border-bottom:1px solid var(--border); vertical-align:middle; }
.data-table tbody tr:last-child td { border-bottom:none; }
.data-table tbody tr:hover { background: var(--gray-25); cursor:pointer; }
.data-table .row-title { font-weight:650; color: var(--text-primary); }
.data-table .row-sub { font-size:11px; color: var(--text-muted); margin-top:1px; }
.data-table .row-link { color: var(--blue); font-weight:650; }
.data-table .row-link:hover { text-decoration:underline; }

.status-pill {
  display:inline-flex; align-items:center; gap:5px; padding: 3px 9px; border-radius:100px; font-size:10.5px; font-weight:700;
}
.status-pill.on-track, .status-pill.active, .status-pill.accepted { background: var(--green-pale); color: var(--green); }
.status-pill.at-risk, .status-pill.pending { background: var(--amber-pale); color: var(--amber); }
.status-pill.delayed, .status-pill.expired { background: var(--red-pale); color: var(--red); }
.status-pill.draft, .status-pill.not-started { background: var(--gray-100); color: var(--text-secondary); }
.status-pill.sent { background: var(--blue-pale); color: var(--blue-dark); }

.tag-pill { display:inline-block; padding: 2px 8px; border-radius:5px; font-size:10.5px; font-weight:650; background: var(--gray-100); color: var(--text-secondary); }
.tag-pill.core { background: var(--blue-pale); color: var(--blue-dark); }

.dot-cluster { display:inline-flex; gap:2px; align-items:center; }
.dot-cluster .d { width:7px; height:7px; border-radius:50%; }

.rc-table tbody tr:hover { background:transparent; cursor:default; }
.rc-table td.num { padding: 6px 10px; }
.rc-cell-input {
  width: 84px; text-align:right; padding: 7px 8px; font-size:12.5px; font-weight:650;
  border:1px solid var(--border); border-radius:6px; background: var(--gray-25); color: var(--text-primary);
}
.rc-cell-input:focus { outline:none; border-color: var(--blue); background:white; }
/* Dollar-amount cells only (unit price grid, VERIFY bands, portfolio
   tiers) -- NOT the decimal rate/markup-factor cells, which aren't
   currency. Wraps the same .rc-cell-input in a relative box with a $
   prefix positioned over it, rather than putting "$" inside the typed
   value itself (which formatCurrencyInput would have to strip/re-add on
   every keystroke, adding needless complexity for a static prefix). */
.rc-cell-currency { position:relative; display:inline-block; }
.rc-cell-currency::before {
  content:"$"; position:absolute; left:8px; top:50%; transform:translateY(-50%);
  font-size:12.5px; font-weight:650; color: var(--text-muted); pointer-events:none;
}
.rc-cell-currency .rc-cell-input { padding-left:18px; }

/* ============================================================
   INSPECTION RATE CARD + INSPECTION GOVERNANCE (v2i) — the
   per_ahj_category branch of Rate Cards. Column-header-centering and
   the Governance table's expand/collapse + checkbox/dropdown/notes
   shape are carried over verbatim from the approved mockup
   ("Inspection Rate Card + Governance Mockup.html", mk-rate-table /
   mk-gov-table classes) -- renamed with an ir- prefix here to fit this
   file's naming convention (rc-* is already taken by the per-unit
   grids' own classes) rather than importing the mockup's mk- prefix,
   but the rules themselves are unchanged from what was reviewed and
   approved.
   ============================================================ */
.ir-search-wrap { position:relative; display:inline-flex; align-items:center; margin-bottom:12px; }
.ir-search-wrap i.ti-search { position:absolute; left:10px; font-size:13px; color:var(--text-muted); pointer-events:none; }
.ir-search-input { font-size:12.5px; padding:8px 11px 8px 30px; width:240px; }
/* "+ Add Region" / "+ Add AHJ" -- sits inline with the search box, same
   row, same bottom margin so both controls align on one line above
   each table (search grows/shrinks independently since it's a separate
   inline-flex box, not a shared flex parent that would need the whole
   row restructured). */
.ir-toolbar-row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:0; }
.ir-toolbar-row .ir-search-wrap { margin-bottom:0; }

/* Rate card table — column headings centered directly over their values,
   per the approved mockup's explicit correction from renderRateCardTableLive's
   left-aligned headers. */
.ir-rate-table { width:100%; border-collapse:collapse; min-width:900px; }
.ir-rate-table thead th { text-align:center; font-size:10.5px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.3px; padding:8px 10px; border-bottom:1px solid var(--border); }
.ir-rate-table thead th:first-child { text-align:left; }
.ir-rate-table tbody td { padding:8px 10px; border-bottom:1px solid var(--border); vertical-align:middle; text-align:center; }
.ir-rate-table tbody td:first-child { text-align:left; }
.ir-rate-table tbody tr:hover { background:var(--gray-25); }
.ir-rate-table .rc-cell-currency { display:block; margin:0 auto; width:100px; }
.ir-rate-table .rc-cell-currency .rc-cell-input { width:100%; text-align:right; }

/* Governance table */
.ir-gov-table { width:100%; border-collapse:collapse; min-width:1160px; }
.ir-gov-table thead th { text-align:center; font-size:10.5px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.3px; padding:8px 6px; border-bottom:1px solid var(--border); }
.ir-gov-table thead th:first-child { text-align:left; padding-left:14px; }
.ir-gov-table thead th.ir-notes-header { text-align:left; }
.ir-gov-parent-row td { padding:10px 6px; border-bottom:1px solid var(--border); background:var(--gray-25); vertical-align:middle; }
.ir-gov-child-row td { padding:8px 6px; border-bottom:1px solid var(--border); vertical-align:middle; }
.ir-gov-name-cell { padding-left:14px !important; min-width:210px; }
.ir-gov-expand-btn { width:18px; height:18px; border:none; background:var(--gray-100); border-radius:4px; color:var(--text-secondary); font-size:10px; cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
.ir-gov-cell { text-align:center; min-width:130px; }
.ir-gov-cell-inner { display:flex; align-items:center; justify-content:center; gap:6px; }
.ir-gov-chk-wrap { display:inline-flex; cursor:pointer; flex-shrink:0; }
.ir-gov-freq-select { font-size:10.5px; font-weight:600; color:var(--text-primary); padding:4px 4px; border:1px solid var(--border); border-radius:5px;
  background:var(--gray-25); max-width:100px; }
.ir-gov-freq-select:disabled { color:var(--text-muted); background:var(--gray-100); border-color:var(--border); cursor:not-allowed; }
.ir-gov-freq-select:not(:disabled):focus { outline:none; border-color:var(--blue); background:white; }
.ir-gov-notes-cell { font-size:11px; color:var(--text-secondary); line-height:1.5; min-width:240px; max-width:280px; padding-right:14px !important; }
.ir-gov-notes-cell input.text-input { font-size:11px; padding:6px 8px; }
.ir-gov-notes-empty { color:var(--text-muted); }

/* ============================================================
   TABS (detail pages)
   ============================================================ */
.tabs { display:flex; gap: 20px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
.tab-btn { padding: 9px 2px; font-size:12.5px; font-weight:650; color: var(--text-muted); border-bottom:2px solid transparent; cursor:pointer; white-space:nowrap; }
.tab-btn.active { color: var(--blue); border-bottom-color: var(--blue); }
.tab-btn:hover:not(.active) { color: var(--text-primary); }

/* ============================================================
   CARDS
   ============================================================ */
.card { background:white; border:1px solid var(--border); border-radius: var(--radius); }
.card-pad { padding: 16px 18px; }
.card-header { display:flex; align-items:center; justify-content:space-between; padding: 13px 16px; border-bottom:1px solid var(--border); }
.card-title { font-size:13px; font-weight:700; margin:0; }
.section-title { font-size:14px; font-weight:750; margin:0; }

.two-col { display:grid; grid-template-columns: 1fr 320px; gap:16px; align-items:start; }
.sticky-side { position: sticky; top: 20px; }

.kv-list { display:flex; flex-direction:column; gap:8px; }
.kv-row { display:flex; justify-content:space-between; align-items:center; font-size:12.5px; }
.kv-row .k { color: var(--text-secondary); }
.kv-row .v { font-weight:650; }

/* ============================================================
   HERO BAND (detail pages)
   ============================================================ */
.hero-band {
  background: var(--navy); color:white; border-radius: var(--radius); padding: 18px 20px; margin-bottom: 14px;
}
.hero-band .htitle { font-size: 17px; font-weight:750; margin:0 0 6px 0; }
.hero-band .hmeta { display:flex; gap:16px; align-items:center; font-size:11.5px; color: rgba(255,255,255,0.6); flex-wrap:wrap; }

/* ============================================================
   FORM FIELDS
   ============================================================ */
.field-group { margin-bottom: 14px; }
.field-label { display:block; font-size:11px; font-weight:700; color: var(--text-secondary); text-transform:uppercase; letter-spacing:0.3px; margin-bottom:5px; }
.text-input, .select-input, textarea.text-input {
  width:100%; padding: 8px 11px; border:1px solid var(--border-strong); border-radius: var(--radius-sm);
  background: var(--gray-25); font-size:12.5px; color: var(--text-primary);
}
.text-input:focus, .select-input:focus, textarea.text-input:focus { outline:none; border-color: var(--blue); background:white; }
.field-row-2 { display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
.field-hint { font-size:10.5px; color: var(--text-muted); margin-top:4px; }

.stepper-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(80px,1fr)); gap:10px; margin: 10px 0; }
.stepper { background: var(--gray-25); border:1px solid var(--border); border-radius: var(--radius-sm); padding:8px 10px; text-align:center; }
.stepper.total { background: var(--blue-pale); border-color:#cddffb; }
.stepper .slabel { font-size:9.5px; font-weight:700; color: var(--text-muted); text-transform:uppercase; margin-bottom:4px; }
.stepper .sval-row { display:flex; align-items:center; justify-content:center; gap:8px; }
.stepper .sval { font-size:15px; font-weight:750; min-width:20px; }
.stepper .schev { color: var(--text-muted); cursor:pointer; font-size:11px; padding:2px; }
.stepper .schev:hover { color: var(--blue); }

/* ============================================================
   SLIDE-OVER DRAWER
   ============================================================ */
.drawer-backdrop { position:fixed; inset:0; background: rgba(10,22,40,0.32); z-index:200; }
.drawer { position:fixed; top:0; right:0; height:100vh; width: 460px; max-width:92vw; background:white; z-index:201;
  box-shadow: var(--shadow-drawer); display:flex; flex-direction:column; }
.drawer-header { background: var(--navy); color:white; padding: 16px 20px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.drawer-header h2 { font-size:14.5px; font-weight:700; margin:0; }
.drawer-close { color: rgba(255,255,255,0.6); font-size:16px; cursor:pointer; background:none; border:none; padding:2px 6px; }
.drawer-close:hover { color:white; }
.drawer-body { flex:1; overflow-y:auto; padding: 18px 20px; }
.drawer-footer { padding: 14px 20px; border-top:1px solid var(--border); display:flex; gap:8px; flex-shrink:0; }
.drawer-section-label { font-size:10.5px; font-weight:700; color: var(--text-muted); text-transform:uppercase; letter-spacing:0.4px; margin: 4px 0 10px 0; }

/* ============================================================
   MODAL
   ============================================================ */
.modal-backdrop { position:fixed; inset:0; background: rgba(10,22,40,0.4); z-index:300; display:flex; align-items:center; justify-content:center; }
.modal { background:white; border-radius: var(--radius); box-shadow: var(--shadow-modal); max-width: 90vw; max-height:86vh;
  overflow-y:auto; padding: 22px 24px; }
.modal.wide { width: 720px; }
.modal.narrow { width: 420px; }
.modal-title { display:flex; align-items:center; gap:8px; font-size:15px; font-weight:750; margin: 0 0 4px 0; }
.modal-desc { font-size:12px; color: var(--text-secondary); margin: 0 0 16px 0; }
.modal-footer { display:flex; justify-content:flex-end; gap:8px; margin-top:18px; }

/* ============================================================
   TOAST
   ============================================================ */
.toast-wrap { position:fixed; bottom: 22px; left:50%; transform:translateX(-50%); z-index:400; }
.toast { background: var(--green); color:white; padding: 10px 18px; border-radius: 7px; font-size:12.5px; font-weight:600;
  box-shadow: 0 8px 24px rgba(0,0,0,0.2); }
.toast.error { background: var(--red); }

/* ============================================================
   PROGRESS BAR
   ============================================================ */
.progress-track { height:6px; background: var(--gray-100); border-radius:100px; overflow:hidden; }
.progress-fill { height:100%; background: var(--blue); border-radius:100px; }
.progress-fill.green { background: var(--green); }
.progress-fill.purple { background: var(--purple); }

/* ============================================================
   EXPLORE SCENARIO PANEL (carried over pattern, retoned to navy/purple)
   ============================================================ */
.explore-panel { border-color: var(--border); transition: border-color .15s ease; padding:0; }
.explore-panel.open { border-color: var(--purple); box-shadow: 0 0 0 1px var(--purple); }
.explore-panel-head { display:flex; align-items:center; justify-content:space-between; padding: 14px 16px; cursor:pointer; user-select:none; }
.explore-dot { width:8px; height:8px; border-radius:50%; background: var(--purple); flex-shrink:0; }
.explore-panel-body { padding: 4px 16px 18px 16px; border-top:1px solid var(--border); }
.explore-slider-row { padding: 12px 0; border-bottom: 1px dashed var(--border); }
.explore-slider-row:last-of-type { border-bottom:none; }
.explore-slider-label { display:flex; justify-content:space-between; align-items:baseline; font-size:12.5px; font-weight:600; margin-bottom:6px; }
.explore-slider-val { font-variant-numeric: tabular-nums; font-weight:700; color: var(--purple); min-width:44px; text-align:right; }
.explore-slider { width:100%; -webkit-appearance:none; appearance:none; height:4px; border-radius:2px;
  background: linear-gradient(to right, var(--purple) 0%, var(--purple) 50%, var(--border) 50%, var(--border) 100%);
  outline:none; margin: 4px 0; }
.explore-slider::-webkit-slider-thumb { -webkit-appearance:none; appearance:none; width:16px; height:16px; border-radius:50%;
  background:white; border: 2.5px solid var(--purple); cursor:pointer; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.explore-slider::-moz-range-thumb { width:16px; height:16px; border-radius:50%; background:white; border: 2.5px solid var(--purple);
  cursor:pointer; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.explore-slider-range { display:flex; justify-content:space-between; font-size:10px; color:var(--text-muted); margin-top:3px; }

/* ============================================================
   MISC
   ============================================================ */
.badge-internal { border:1px solid var(--border-strong); color: var(--text-muted); font-size:10.5px; font-weight:650;
  padding: 3px 9px; border-radius:100px; background:white; }
.empty-state { text-align:center; padding: 50px 20px; color: var(--text-muted); }
.empty-state .ic { font-size: 28px; opacity:0.35; margin-bottom:10px; }

/* ============================================================
   ESTIMATE SHEET (document style)
   ============================================================ */
.estimate-sheet { background:white; border:1px solid var(--border); border-radius: var(--radius); padding: 26px 30px; }
.es-header { display:flex; justify-content:space-between; align-items:flex-start; padding-bottom:16px; border-bottom:2px solid var(--navy); margin-bottom:16px; }
.es-brand { display:flex; align-items:center; gap:10px; }
.es-brand-mark { width:36px; height:36px; border-radius:8px; background: linear-gradient(135deg, var(--blue), var(--blue-dark)); display:flex; align-items:center; justify-content:center; color:white; font-weight:800; }
.es-header h1 { font-size:16px; margin:0; }
.es-doc-meta { text-align:right; font-size:11.5px; color: var(--text-muted); }
.es-doc-meta .doc-id { font-weight:700; color: var(--text-primary); }
.es-info-grid { display:grid; grid-template-columns: repeat(3,1fr); gap:14px; margin-bottom:20px; }
.es-info-grid .k { font-size:10px; font-weight:700; text-transform:uppercase; color: var(--text-muted); letter-spacing:0.3px; margin-bottom:3px; }
.es-info-grid .v { font-size:12.5px; font-weight:650; }
.es-h2 { font-size:12.5px; font-weight:750; margin: 18px 0 8px 0; text-transform:uppercase; letter-spacing:0.3px; color: var(--text-secondary); }
.es-table { width:100%; border-collapse:collapse; font-size:12.5px; }
.es-table thead th { text-align:left; font-size:10.5px; color: var(--text-muted); font-weight:700; padding: 6px 0; border-bottom:1px solid var(--border); }
.es-table thead th.num, .es-table td.num { text-align:right; }
.es-table tbody td { padding: 8px 0; border-bottom:1px solid var(--border); }
.es-total-row td { font-weight:800; font-size:14px; border-top:2px solid var(--navy); border-bottom:none; padding-top:10px; }
.es-footnote { font-size:10.5px; color: var(--text-muted); margin-top:18px; line-height:1.5; }
/* v2j: Travel Backup Detail's Sales/Admin edition label -- same
   convention as the approved mockup (Travel Backup Detail — Sales.html
   / — Admin.html). */
.role-chip { display:inline-block; padding:2px 9px; border-radius:5px; font-size:10.5px; font-weight:700;
  text-transform:uppercase; letter-spacing:0.3px; margin-left:8px; vertical-align:1px; }
.role-chip.sales { background: var(--blue-pale); color: var(--blue-dark); }
.role-chip.admin { background: var(--purple-pale); color: var(--purple); }

/* "Download PDF" -- print-isolate whichever .print-target was set by
   downloadDocumentPDF() just before window.print() was called; every
   other element on the page (sidebar, wizard chrome, the OTHER
   document if both are on screen) is hidden from the print output. */
@media print {
  body * { visibility: hidden; }
  .print-target, .print-target * { visibility: visible; }
  .print-target { position: absolute; left: 0; top: 0; width: 100%; margin: 0; border: none; box-shadow: none; }
}

/* ============================================================
   WIZARD
   ============================================================ */
.wizard-steps { display:flex; align-items:center; margin-bottom:20px; }
.wizard-step { display:flex; align-items:center; gap:8px; flex-shrink:0; }
.wizard-step .dot { width:22px; height:22px; border-radius:50%; background: var(--gray-100); color: var(--text-muted);
  display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:700; flex-shrink:0; }
.wizard-step.done .dot { background: var(--green); color:white; }
.wizard-step.current .dot { background: var(--blue); color:white; }
.wizard-step .lbl { font-size:11.5px; font-weight:600; color: var(--text-muted); white-space:nowrap; }
.wizard-step.current .lbl { color: var(--text-primary); }
.wizard-sep { flex:1; height:1px; background: var(--border); margin: 0 10px; min-width:20px; }
.wizard-sep.done { background: var(--green); }

.type-choice-card { border: 1.5px solid var(--border-strong); border-radius: var(--radius); padding: 16px; cursor:pointer; transition: all .12s; }
.type-choice-card:hover { border-color: var(--blue); background: var(--blue-pale); }
.type-choice-card.selected { border-color: var(--blue); background: var(--blue-pale); box-shadow: 0 0 0 1px var(--blue); }
.type-choice-card .tc-title { font-weight:750; font-size:13.5px; margin-bottom:5px; }
.type-choice-card .tc-desc { font-size:11.5px; color: var(--text-secondary); line-height:1.5; }

.service-list { display:flex; flex-direction:column; gap:6px; }
.service-row { display:flex; align-items:flex-start; gap:10px; padding:10px 12px; border:1px solid var(--border);
  border-radius: var(--radius-sm); cursor:pointer; transition: all .1s; }
.service-row:hover { border-color: var(--gray-500); }
.service-row.checked { border-color: var(--blue); background: var(--blue-pale); }
.service-row .chk { width:16px; height:16px; border-radius:4px; border:1.5px solid var(--border-strong); background:white;
  display:flex; align-items:center; justify-content:center; font-size:10px; color:white; flex-shrink:0; margin-top:1px; }
.service-row.checked .chk { background: var(--blue); border-color: var(--blue); }
.service-row .srv-name { font-weight:650; font-size:12.5px; }
.service-row .srv-desc { font-size:11px; color: var(--text-muted); margin-top:2px; line-height:1.4; }
.pricing-model-tag { font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.3px; color: var(--text-muted);
  background: var(--gray-100); padding:1px 6px; border-radius:4px; margin-left:6px; }

.dropzone { border: 1.5px dashed var(--border-strong); border-radius: var(--radius); padding: 24px; text-align:center; cursor:pointer; transition: all .1s; }
.dropzone:hover { border-color: var(--blue); background: var(--blue-pale); }
.dz-icon { font-size:20px; color: var(--text-muted); margin-bottom:6px; }
.dz-title { font-weight:650; font-size:12.5px; }
.dz-sub { font-size:11px; color: var(--text-muted); margin-top:3px; }

.deliverable-choice { border: 1.5px solid var(--border-strong); border-radius: var(--radius); padding: 16px; cursor:pointer; transition: all .1s; }
.deliverable-choice:hover { border-color: var(--blue); }
.deliverable-choice.selected { border-color: var(--blue); background: var(--blue-pale); box-shadow: 0 0 0 1px var(--blue); }
.deliverable-choice .dc-head { display:flex; align-items:center; gap:9px; margin-bottom:5px; }
.deliverable-choice .chk { width:16px; height:16px; border-radius:4px; border:1.5px solid var(--border-strong); background:white;
  display:flex; align-items:center; justify-content:center; font-size:10px; color:white; flex-shrink:0; }
.deliverable-choice.selected .chk { background: var(--blue); border-color: var(--blue); }
.deliverable-choice .tc-title { margin-bottom:0; }

/* ============================================================
   PERSONNEL ROSTER + MANAGE USERS (merged in from the former
   standalone admin tool, personnel_admin.html) — both are admin-only
   sidebar views now rather than a separate file/login.
   ============================================================ */
.status-pill.ok { background: var(--green-pale); color: var(--green); }
.status-pill.failed { background: var(--red-pale); color: var(--red); }
.status-pill.non-field { background: var(--gray-100); color: var(--text-secondary); }
.stat-tile .value.good { color: var(--green); }
.stat-tile .value.warn { color: var(--amber); }
.toast.success { background: var(--green); }
.file-drop {
  border: 2px dashed var(--border-strong); border-radius: var(--radius); padding: 28px; text-align:center;
  background: var(--gray-25); font-size:13px; color: var(--text-secondary);
}
.file-drop input[type=file] { margin-top: 10px; }
.role-pill.admin { background: var(--purple-pale); color: var(--purple); }
.role-pill.sales { background: var(--blue-pale); color: var(--blue-dark); }
.role-pill.general { background: var(--gray-100); color: var(--text-secondary); }
.you-badge { font-size:10px; font-weight:700; color: var(--text-muted); margin-left:6px; }
.form-error {
  background: var(--red-pale); color: var(--red); border:1px solid #f2c6c6; border-radius: var(--radius-sm);
  padding: 9px 12px; font-size:12px; margin-bottom:12px;
}
.row-actions { display:flex; gap:6px; flex-wrap:wrap; }
.row-actions .btn { padding:6px 10px; font-size:11.5px; }
.field { margin-bottom: 12px; }
.field label { display:block; font-size:11.5px; font-weight:650; color: var(--text-secondary); margin-bottom:5px; }
.field input, .field select {
  width:100%; padding: 9px 11px; font-size:13px; border:1px solid var(--border-strong); border-radius: var(--radius-sm);
  font-family: var(--font); background:white;
}
</style>
</head>

        <div class="login-logo-row">
          <svg class="login-logo-mark" viewBox="0 0 40 40" fill="none">
            <path d="M2 21h6l3-9 5 17 4-13 3 5h15" stroke="#2fd9a8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </svg>

              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

<script>
/* ============================================================
   AUTH — real server-side session against the live Worker. Rate
   cards and pricing math live ONLY on the server (see /api/price/*
   below); this page never holds a rate table, so there is nothing
   confidential to protect client-side beyond the session token itself.
   ============================================================ */
// APP VERSION — bump this on every code change pushed to this file, per
// the standing rule in the continuity brief ("every new code gets a new
// version"). Shown in the sidebar footer, same pattern as PULSE Mod, so
// Misty can confirm at a glance which build is actually live after a
// deploy rather than assuming a push took effect.
const APP_VERSION = 'v2x';

const WORKER_URL = 'https://pulse-pricing-api.misty-munoz.workers.dev';
let sessionToken = null;
let currentUser = null; // { id, name, role }

// SESSION PERSISTENCE ACROSS A REFRESH — same real pattern as PULSE Mod's
// tryRestorePulseSession()/sessionStorage.pulse_session (confirmed by
// reading pulse_v68k_build.html directly, not invented): sessionToken and
// currentUser previously lived ONLY in these two JS variables above, so
// any browser refresh wiped them and dropped back to the login screen
// even though the Worker's session (sessions table + SESSIONS_KV, 12h
// TTL per Worker v1d's SESSION_TTL_SECONDS) was still perfectly valid
// server-side. This is that same fix, applied here: persist just enough
// to restore the session in sessionStorage (NOT localStorage — same
// choice Mod made, and for the same reason: sessionStorage clears when
// the tab/window actually closes, so this survives a refresh without
// turning into a permanent login the way localStorage would).
const SESSION_STORAGE_KEY = 'pulse_pricing_session';
function saveSessionToStorage(){
  try {
    sessionStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify({ token: sessionToken, user: currentUser }));
  } catch(e){ /* sessionStorage unavailable (private browsing, etc.) -- session restore just won't work, not fatal */ }
}
function clearSessionStorage(){
  try { sessionStorage.removeItem(SESSION_STORAGE_KEY); } catch(e){}
}
// Restore on page load, before ever showing the login screen. Unlike
// Mod (which re-verifies an "Active" flag on a separate Airtable table
// in the background after an optimistic restore), Pricing's session
// token itself IS the full validity check -- getSession() on the Worker
// already rejects an expired or revoked token on every authenticated
// call. So no separate background verify call is needed here: if the
// restored token is stale, the very next workerFetch() call gets a 401
// and workerFetch() below already routes that straight back to a clean
// login screen, same as if the token had never been restored at all.
function tryRestoreSession(){
  let saved = null;
  try {
    const raw = sessionStorage.getItem(SESSION_STORAGE_KEY);
    if (raw) saved = JSON.parse(raw);
  } catch(e){ return false; }
  if (!saved || !saved.token || !saved.user) return false;
  sessionToken = saved.token;
  currentUser = saved.user;
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('root').classList.remove('hidden');
  // Bug fix (2026-08-27, found by Misty): a restored session used to call
  // render() directly, which draws whatever's already in OFFERS -- still
  // the empty [] it's initialized to, since nothing has fetched yet. That
  // left the Offers view looking empty on every fresh page load/restore
  // until the user clicked away and back (which does go through goTo(),
  // see loadOffers() below). goTo('offers') is the same entry point the
  // sidebar uses and already triggers loadOffers(), so route the restore
  // through it instead of calling render() bare.
  goTo('offers');
  return true;
}

async function workerFetch(path, opts = {}) {
  const o = { ...opts };
  o.headers = { ...(o.headers || {}) };
  if (sessionToken) o.headers['Authorization'] = 'Bearer ' + sessionToken;
  const res = await fetch(WORKER_URL + path, o);
  // A 401 here means the session the user was restored with (or is
  // actively using) is no longer valid server-side -- expired past its
  // 12h TTL, or revoked by a logout elsewhere. Whatever's cached client-
  // side is stale either way, so drop back to a clean login screen
  // rather than leaving a half-authenticated UI on screen. /login and
  // /api/auth/set-pin themselves 401 on a genuinely wrong PIN, not a
  // stale session -- excluded here so a failed login attempt doesn't
  // get misread as "your session expired".
  if (res.status === 401 && path !== '/login' && path !== '/api/auth/set-pin') {
    sessionToken = null; currentUser = null; pendingResetToken = null;
    clearSessionStorage();
    document.getElementById('root').classList.add('hidden');
    document.getElementById('login-screen').classList.remove('hidden');
  }
  return res;
}

function setLoginError(message) {
  const el = document.getElementById('login-error');
  if (message) { el.textContent = message; el.style.display = 'block'; }
  else { el.textContent = ''; el.style.display = 'none'; }
}

// Generic show/hide toggle for any PIN <input> + its trigger <button>,
// used by the reset-pin screen's two fields. The main login PIN field
// uses toggleLoginPinVisibility() below instead, since it also needs to
// swap its icon and aria-label in a fixed pair of elements.
function toggleVisibility(inputId, btnEl) {
  const input = document.getElementById(inputId);
  const showing = input.type === 'text';
  input.type = showing ? 'password' : 'text';
  btnEl.setAttribute('aria-label', showing ? 'Show PIN' : 'Hide PIN');
  btnEl.setAttribute('title', showing ? 'Show PIN' : 'Hide PIN');
}

  btn.setAttribute('title', showing ? 'Show PIN' : 'Hide PIN');

  icon.innerHTML = showing
    ? '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path><circle cx="12" cy="12" r="3"></circle>'
    : '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a18.6 18.6 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
}

// Holds the reset token between doLogin()'s mustResetPin branch and
// submitNewPermanentPin() -- deliberately not sessionToken, since a
// reset token must never be usable as a normal auth header (see the
// Worker's reset_tokens table comment).
let pendingResetToken = null;

async function doLogin() {
  const name = document.getElementById('loginName').value.trim();
  const pin = document.getElementById('loginPin').value.trim();
  setLoginError(null);
  if (!name || !pin) { setLoginError('Enter your name and PIN to continue.'); return; }

  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  try {
    const res = await fetch(WORKER_URL + '/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, pin }),
    });
    const data = await res.json();
    if (!res.ok) {
      setLoginError(data.error || 'Sign in failed. Try again.');
      return;
    }
    if (data.mustResetPin) {
      // Authenticated with a one-time PIN (new account or admin
      // reset/resend) -- no session yet, just a reset token good for
      // exactly one thing: setting a permanent PIN. Show that screen
      // instead of the main app.
      pendingResetToken = data.resetToken;
      document.getElementById('reset-pin-welcome').textContent =
        `Hi ${data.user.name} — you signed in with a one-time PIN. Choose your own permanent one now.`;
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('reset-pin-screen').classList.remove('hidden');
      return;
    }
    if (!data.token) {
      setLoginError(data.error || 'Sign in failed. Try again.');
      return;
    }
    if (!['admin', 'sales'].includes(data.user.role)) {
      // Server-verified role, not a client assumption -- only admin and
      // sales accounts are valid; anything else is rejected here as a
      // defense-in-depth check even though the Worker won't issue any
      // other role.
      setLoginError('This account is not set up for PULSE Pricing. Contact your admin.');
      return;
    }
    sessionToken = data.token;
    currentUser = data.user;
    saveSessionToStorage();
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('root').classList.remove('hidden');
    // Same fix as tryRestoreSession() above -- a fresh login also used to
    // call render() bare, drawing the still-empty OFFERS array instead of
    // fetching it. goTo('offers') fetches fresh via loadOffers().
    goTo('offers');
  } catch (e) {
    setLoginError('Could not reach the server. Check your connection and try again.');
  } finally {
    btn.disabled = false;
  }
}

function setResetPinError(message) {
  const el = document.getElementById('reset-pin-error');
  if (message) { el.textContent = message; el.style.display = 'block'; }
  else { el.textContent = ''; el.style.display = 'none'; }
}

async function submitNewPermanentPin() {
  const newPin = document.getElementById('newPermanentPin').value.trim();
  const confirmPin = document.getElementById('confirmPermanentPin').value.trim();
  setResetPinError(null);
  if (!newPin || newPin.length < 6) { setResetPinError('PIN must be at least 6 characters.'); return; }
  if (!/[a-zA-Z]/.test(newPin) || !/[0-9]/.test(newPin)) { setResetPinError('PIN must contain at least one letter and one number.'); return; }
  if (newPin !== confirmPin) { setResetPinError('PINs do not match.'); return; }

  const btn = document.getElementById('resetPinSubmitBtn');
  btn.disabled = true;
  try {
    const res = await fetch(WORKER_URL + '/api/auth/set-pin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ resetToken: pendingResetToken, newPin }),
    });
    const data = await res.json();
    if (!res.ok || !data.token) {
      setResetPinError(data.error || 'Could not set your PIN. Try again.');
      return;
    }
    pendingResetToken = null;
    if (!['admin', 'sales'].includes(data.user.role)) {
      setResetPinError('This account is not set up for PULSE Pricing. Contact your admin.');
      return;
    }
    sessionToken = data.token;
    currentUser = data.user;
    saveSessionToStorage();
    document.getElementById('reset-pin-screen').classList.add('hidden');
    document.getElementById('root').classList.remove('hidden');
    render();
  } catch (e) {
    setResetPinError('Could not reach the server. Check your connection and try again.');
  } finally {
    btn.disabled = false;
  }
}

// Decorative particle wave. Color was still the old purple
// (rgba(139,110,242) = #8B6EF2) left over from before the navy/mint
// rebrand -- everything else on this login screen already switched
// (see Confirmed Decision #12), this canvas just got missed. Now uses
// the same --mint token (#2fd9a8 = rgb(47,217,168)) as the rest of the
// screen instead of a separate invented green.
function initParticles(canvasId, opts) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  let w, h;
  function resize() {
    const rect = canvas.parentElement.getBoundingClientRect();
    w = canvas.width = rect.width;
    h = canvas.height = rect.height;
  }
  resize();
  window.addEventListener('resize', resize);
  const dots = [];
  for (let i = 0; i < opts.count; i++) {
    dots.push({ x: Math.random(), y: 0.55 + Math.random() * 0.45, size: 0.6 + Math.random() * 1.4, phase: Math.random() * Math.PI * 2 });
  }
  let t = 0;
  function frame() {
    t += 0.006;
    ctx.clearRect(0, 0, w, h);
    dots.forEach(d => {
      const waveY = d.y * h + Math.sin(t * 2 + d.x * 10 + d.phase) * 14;
      const alpha = 0.15 + 0.35 * Math.abs(Math.sin(t + d.phase));
      ctx.beginPath();
      ctx.arc(d.x * w, waveY, d.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(47,217,168,${alpha})`;
      ctx.fill();
    });
    requestAnimationFrame(frame);
  }
  frame();
}

async function loadOffers(){
  try {

    const data = await res.json();

function goTo(view){
  const patch = { view, drawer:null, modal:null };
  if(view==='wizard') patch.wizard = freshWizardState();
  // Rate Cards is admin-only and reads the real card fresh from the
  // Worker every visit -- never trust a stale cached copy, and never
  // let a non-admin session land here (server would 403 anyway, but
  // don't even try, and don't render stale/empty state at that route).
  if(view==='ratecard'){
    if(!currentUser || currentUser.role!=='admin'){ return; }
    patch.rateCardData = null;
    setState(patch);
    loadRateCardData();
    return;
  }
  if(view==='personnel'){
    if(!currentUser || currentUser.role!=='admin'){ return; }
    setState(patch);
    loadImportHistory();
    return;
  }
  if(view==='users'){
    if(!currentUser || currentUser.role!=='admin'){ return; }
    patch.usersData = null;
    setState(patch);
    loadUsers();
    return;
  }
  // Offers and Pricing Analytics both read from the real, live roster --
  // reload fresh every time either is entered so a newly generated offer
  // (see confirmGenerateOffer) or a status change elsewhere always shows.
  if(view==='offers' || view==='admin'){
    setState(patch);
    loadOffers();
    return;
  }
  setState(patch);
}

    city: '',

    regionSuggestion: null,

    // what the user has actually confirmed (accepting a suggestion or
    // picking an override both count as confirming) -- pricing only ever

    siteAhjSuggestions: {},
    siteRegionSuggestions: {},

    siteRegion: {},

function setWizard(patch){ Object.assign(state.wizard, patch); refreshPricing(); render(); }
// setWizard's normal path calls render() synchronously on every call --
// correct for text fields (the focus/selection-restore in render() makes
// that safe) but wrong for a native <input type="range"> mid-drag: a
// range thumb's drag is tracked by the browser's mouse-capture on that
// exact DOM node, and render() destroys and recreates that node on every
// tick. Re-focusing the new node afterward (which render() already does
// by id) does NOT restore mouse-capture -- confirmed by a scripted drag
// test that showed the slider's value freezing after the very first tick
// even though the mouse kept moving. So sliders get their own path: patch
// state and kick off the (already-debounced) pricing refetch, which will
// render() itself once new numbers arrive -- but skip the synchronous
// render() here, so the slider's own DOM node survives the whole drag.
// The visible %/label still needs to feel live during the drag, so we
// patch just that text directly instead of waiting on the network.
function setWizardSlider(svcId, pct){
  state.wizard.priceAdjust = { ...state.wizard.priceAdjust, [svcId]: pct };
  refreshPricing();
  const label = document.querySelector(`#price-adjust-${svcId}`)?.closest('.explore-slider-row')?.querySelector('.explore-slider-val');
  if(label) label.textContent = `${pct>0?'+':''}${pct}%`;
}

/* ============================================================
   AHJ auto-suggest (single-property mode, Inspection service only).
   Reported 2026-08-26: this used to fire automatically on Step 1 as
   soon as city/state were typed, for EVERY single-property offer --
   even ones that never end up offering Inspection, the only service
   that actually depends on AHJ. Moved so the lookup only ever fires
   for an explicit reason to need one: checking Inspection in Step 3
   (see toggleService()), or clicking "Look up AHJ" there if Inspection
   was already checked before an address existed. The picker itself
   now renders inline in Step 3's Inspection card (see
   renderServicePricingCard's per_ahj_category branch) instead of
   Step 1 -- Step 1 still just captures city/state via setWizardSite()
   below, with no AHJ side effect anymore.
   Same "auto-suggest, user confirms" design as before: confirmedAhjId
   only ever changes via the user clicking a choice in renderAhjPicker(),
   never automatically.
   ============================================================ */
let ahjSuggestDebounceTimer = null;
function setWizardSite(patch){
  // Still invalidate a previously confirmed AHJ when the address changes
  // -- that safety property doesn't depend on WHEN the lookup fires,
  // only on the address being stale. No fetch triggered here anymore.
  // v2j: same invalidation now applies to the region suggestion/confirmation
  // -- a stale region is exactly as unsafe to price against as a stale AHJ.
  Object.assign(state.wizard, patch, { confirmedAhjId: null, ahjSuggestion: null, ahjOverrideOpen: false, confirmedRegion: null, regionSuggestion: null });
  render();
}
function triggerAhjLookup(){
  clearTimeout(ahjSuggestDebounceTimer);
  const w = state.wizard;
  if(!w.siteState || !w.siteState.trim()){ return; }
  if(w.ahjSuggestion || w.ahjSuggestionLoading){ return; } // already have one (or one in flight) for the current address
  state.wizard.ahjSuggestionLoading = true;
  render();
  ahjSuggestDebounceTimer = setTimeout(async () => {
    const cityAtCall = state.wizard.city, stateAtCall = state.wizard.siteState;
    try {
      const res = await workerFetch('/api/ahj/suggest', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ city: cityAtCall, state: stateAtCall }),
      });
      const data = await res.json();
      // Guard against a slow response landing after the user typed further
      // changes -- only apply it if the inputs it was computed for are
      // still current.
      if(state.wizard.city === cityAtCall && state.wizard.siteState === stateAtCall){
        state.wizard.ahjSuggestion = res.ok ? data : { match:null, reason:'Lookup failed — choose manually.' };
        state.wizard.ahjSuggestionLoading = false;
        render();
      }
    } catch(e){
      if(state.wizard.city === cityAtCall && state.wizard.siteState === stateAtCall){
        state.wizard.ahjSuggestion = { match:null, reason:'Could not reach the server — choose manually.' };
        state.wizard.ahjSuggestionLoading = false;
        render();
      }
    }
  }, 200);
}
function confirmAhj(ahjId){
  setWizard({ confirmedAhjId: ahjId });
}
function renderAhjPicker(){
  const w = state.wizard;
  if(!w.siteState || !w.siteState.trim()){
    return `<div class="field-group"><div class="notional-banner"><span class="ic">${icon('warn')}</span>Enter this property's city and state on Step 1 to look up its inspecting authority.</div></div>`;
  }
  if(w.ahjSuggestionLoading && !w.ahjSuggestion){
    return `<div class="field-group"><div class="helper-banner"><span class="ic">${icon('check')}</span>Looking up the inspecting authority…</div></div>`;
  }
  if(!w.ahjSuggestion){
    return `<div class="field-group"><button class="btn btn-sm btn-primary" onclick="triggerAhjLookup()">Look up AHJ</button></div>`;
  }
  const s = w.ahjSuggestion;
  const confirmed = w.confirmedAhjId && s.match && w.confirmedAhjId === s.match.id;
  const confidenceLabel = {
    exact_city: 'Matched by city',
    fuzzy_city: 'Approximate city match — please confirm',
    state_level_fallback: 'State-level default — please confirm this is right for this address',
  }[s.confidence] || '';
  return `
  <div class="field-group">
    <label class="field-label">Inspecting Authority (AHJ)</label>

/* ============================================================
   REGION auto-suggest (single-property mode, Inspection only) --
   same debounce/guard/confirm shape as the AHJ lookup above, kept as
   a fully separate function rather than merged into it, since region
   and AHJ are different lookups against different data (see
   resolveRegion()'s Worker-side comment).
   ============================================================ */
let regionSuggestDebounceTimer = null;
function triggerRegionLookup(){
  clearTimeout(regionSuggestDebounceTimer);
  const w = state.wizard;
  if(!w.siteState || !w.siteState.trim()){ return; }
  if(w.regionSuggestion || w.regionSuggestionLoading){ return; }
  state.wizard.regionSuggestionLoading = true;
  render();
  regionSuggestDebounceTimer = setTimeout(async () => {
    const cityAtCall = state.wizard.city, stateAtCall = state.wizard.siteState;
    try {
      const res = await workerFetch('/api/region/suggest', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ city: cityAtCall, state: stateAtCall }),
      });
      const data = await res.json();
      if(state.wizard.city === cityAtCall && state.wizard.siteState === stateAtCall){
        state.wizard.regionSuggestion = res.ok ? data : { region:null, reason:'Lookup failed — choose manually.' };
        state.wizard.regionSuggestionLoading = false;
        render();
      }
    } catch(e){
      if(state.wizard.city === cityAtCall && state.wizard.siteState === stateAtCall){
        state.wizard.regionSuggestion = { region:null, reason:'Could not reach the server — choose manually.' };
        state.wizard.regionSuggestionLoading = false;
        render();
      }
    }
  }, 200);
}

async function ensureRegionListLoaded(){
  if(state.regionList) return;

    state.regionList = [];

// Real client-side parse via SheetJS (same library/pattern as the admin
// Personnel Import screen) -- nothing simulated, no fake sample data.
// Each row in the uploaded file is one physical unit (one elevator),
// which is also exactly the shape /api/price/* wants for its `units`
// array, so parsed rows flow straight into pricing with no reshaping.
// NOT wired yet: nearest-consultant/inspector-firm reconciliation. That
// used to show real names read from a local array -- doing it properly
// now means calling the anonymity-gated /api/personnel/nearest per site
// and showing an anonymous code + distance, which needs geocoding this
// row's city/state first. Deferred rather than shipped half-right;
// pricing itself does not depend on it.
const UPLOAD_REQUIRED_COLS = ['property','address','city','state','unit_id','equipment_type','floors_served'];
function handlePortfolioFile(fileInput){
  const file = fileInput.files && fileInput.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, { type:'array', cellDates:true });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { defval:'', cellDates:true });
      if(!rows.length){ showToast('That file has no rows.', true); return; }
      const headers = Object.keys(rows[0]).map(h=>String(h).trim().toLowerCase());
      const missingCols = UPLOAD_REQUIRED_COLS.filter(c=>!headers.includes(c));
      if(missingCols.length){
        showToast('Missing column(s): ' + missingCols.join(', ') + ' — download the template below.', true);
        return;
      }
      const norm = rows.map((r,i) => {
        const byLower = {};
        Object.keys(r).forEach(k => byLower[String(k).trim().toLowerCase()] = r[k]);
        return {
          id: 'up'+i,
          property: String(byLower.property||'').trim(),
          address: String(byLower.address||'').trim(),
          city: String(byLower.city||'').trim(),
          state: String(byLower.state||'').trim(),
          unit_id: String(byLower.unit_id||'').trim(),
          equipment_type: EQUIP_TYPES.includes(byLower.equipment_type) ? byLower.equipment_type : (byLower.equipment_type || ''),
          floors_served: Number(byLower.floors_served) || 0,
        };
      }).filter(r => r.property || r.unit_id);
      setWizard({ uploadedSites: norm });
      showToast(`${norm.length} units loaded from ${file.name}.`);
    } catch(err){
      showToast('Could not read that file — make sure it is a valid .xlsx or .csv export.', true);
    }
  };
  reader.readAsArrayBuffer(file);
}

function escapeHtml(s){
  if(s==null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function downloadTemplate(){
  // v2u: was a mockup-era workaround (opened the CSV as plain text in a
  // new tab, since script-driven downloads weren't guaranteed to work
  // on a published, view-only preview page). The live site fully
  // supports real downloads, so this now triggers an actual .csv file
  // save via a Blob + temporary object URL, same technique used
  // anywhere a real file download is needed. No popup involved, so the
  // old "pop-up blocked" fallback toast is no longer needed either.
  const csv = "property,address,city,state,unit_id,equipment_type,floors_served\nExample Hotel,123 Main St,Denver,CO,Unit 1,Hydraulic,4\n";
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'pulse_pricing_unit_inventory_template.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

  const byProperty = new Map();
  for(const s of w.uploadedSites){
    if(!s.property) continue;
    if(!byProperty.has(s.property)) byProperty.set(s.property, { key:s.property, property:s.property, city:s.city, state:s.state, unitCount:0 });
    byProperty.get(s.property).unitCount++;
  }
  return Array.from(byProperty.values());
}

/* ============================================================
   LIVE PRICING — every dollar figure in the wizard comes from here.
   No rate table lives in this file; refreshPricing() sends the offer's
   current inputs to the Worker and caches whatever it computes in
   state.wizard.pricingResult. Every render function below reads that
   cache instead of computing locally. setWizard() calls this on every
   input change (slider drag, service toggle, term/contractor change,
   discount tier edit, task line edit) via a short debounce so a slider
   drag doesn't spam the API but still feels live.
   ============================================================ */
let pricingDebounceTimer = null;
function refreshPricing(){
  const w = state.wizard;
  if(!w || !w.offerType || (w.step!==3 && w.step!==4)) return;
  w.pricingLoading = true;
  clearTimeout(pricingDebounceTimer);
  pricingDebounceTimer = setTimeout(async () => {
    const body = {
      offerType: w.offerType,
      units: currentUnits(),
      selectedServices: w.selectedServices,
      priceAdjust: w.priceAdjust,
      retainerFees: w.retainerFees,
      pmInputs: w.pmInputs,
      taskLines: w.taskLines,
      verifyInputs: { termYears: w.contractTermYears, contractors: w.verifyContractors, directCalls: w.verifyDirectCalls },
      // v2v: contractTermYears now also sent as its own top-level field,
      // separate from verifyInputs -- Inspection (and, going forward,
      // every service with a year-breakout control) reads this directly
      // on the Worker side rather than reaching into verifyInputs, which
      // was never really Inspection's data to depend on. See
      // computeOfferTotals' per_ahj_category branch.
      contractTermYears: w.contractTermYears,
      // v2j: Inspection's (ahjId, region) pair -- single sends the one
      // confirmed pair; portfolio sends one per confirmed property (an
      // unconfirmed property is sent with null ahjId/region, and
      // computeOfferTotals() on the Worker skips it rather than guessing --
      // see its per_ahj_category branch). Harmless to always include even
      // when Inspection isn't selected; the server only reads this when it is.
      inspectionInputs: w.offerType === 'single'
        ? { ahjId: w.confirmedAhjId, region: w.confirmedRegion }
        : { sites: currentProperties().map(p => ({ key:p.key, property:p.property, ahjId: w.siteAhj[p.key]||null, region: w.siteRegion[p.key]||null })) },
      // v2j: travel is priced unconditionally against wherever the site(s)
      // actually are (see priceTravel()'s comment) -- not gated on any
      // selected service. Single-property sends its one Step-1 city/state
      // as a synthetic one-site list; empty city/state simply prices to
      // nothing server-side rather than being filtered out here.
      travelSites: w.offerType === 'single'
        ? [{ key:'single', property: w.clientName || w.address || 'Property', city: w.city, state: w.siteState }]
        : currentProperties().map(p => ({ key:p.key, property:p.property, city:p.city, state:p.state })),
      // Volume discount only makes sense against a portfolio award -- a
      // single-property offer has no "% of portfolio" to award, so never
      // send tier data for it even if stale wizard state still has a
      // default tier selected (see freshWizardState's activeDiscountTierId
      // default of 'd1') -- otherwise the server has no way to know this
      // offer type shouldn't get a discount and applies it anyway.
      discountTiers: w.offerType === 'portfolio' ? w.discountTiers : [],
      activeDiscountTierId: w.offerType === 'portfolio' ? w.activeDiscountTierId : null,
      discountOpen: w.offerType === 'portfolio' ? w.discountOpen : false,
    };
    try {
      const res = await workerFetch('/api/price/offer-totals', {
        method: 'POST', headers: { 'Content-Type':'application/json' }, body: JSON.stringify(body),
      });
      const data = await res.json();
      if(!res.ok){ w.pricingError = data.error || 'Pricing failed.'; }
      else { w.pricingResult = data; w.pricingError = null; }
    } catch(e){
      w.pricingError = 'Could not reach the pricing server. Check your connection.';
    }
    w.pricingLoading = false;
    render();
  }, 200);
}

// Reads the cached response from the last refreshPricing() call instead
// of computing anything locally -- returns a zeroed shape (rendered as
// "Calculating..." by callers that check pricingLoading) until the
// first real response comes back. Keeping this function's name and
// return shape identical to the old synchronous version means
// renderWizardStep3/4 and renderEstimateSheetHTML needed no changes.
function computeOfferTotals(){
  const w = state.wizard;
  const r = w.pricingResult;
  if(!r) return { lineItems: [], subtotal:0, discountPct:0, discountAmt:0, total:0, activeTier:null };
  // NOTE: this object is used two ways -- the wizard/estimate-sheet
  // renderers read li.svc.{name,pricingModel} (nested), but this same
  // object is ALSO sent verbatim as the `totals` field of the POST
  // /api/offers body, where createOffer() on the Worker reads a
  // top-level li.pricingModel (flat) to bind into offer_line_items.
  // Confirmed real bug (2026-08-26): only the nested svc.pricingModel
  // was ever set, so createOffer's bind() got li.pricingModel===undefined
  // and D1 threw ("D1PreparedStatement.bind" / Array.map internal error,
  // confirmed from the live Cloudflare error log, worker.js:818) on every
  // single offer save -- root cause of "offer lost on tab switch": the
  // offer was never actually being created at all. Fix: set BOTH the
  // nested and top-level fields so neither consumer breaks.
  const lineItems = r.lineItems.map(li => ({
    svc: { name: li.serviceName, pricingModel: li.pricingModel },
    serviceId: li.serviceId,
    pricingModel: li.pricingModel,
    amount: li.amount,
    isAnnual: !!li.isAnnual,
    isMonthly: !!li.isMonthly,
    detail: li.detail,
    taskLines: li.taskLines,
  }));
  return { lineItems, subtotal: r.subtotal, discountPct: r.discountPct, discountAmt: r.discountAmt, total: r.total, activeTier: r.activeTier };
}

/* ============================================================
   INSPECTION (per_ahj_category) -- portfolio per-property AHJ/region
   assignment + the year-by-year pricing detail shared by both offer
   types. Assignment handlers take an INDEX into currentProperties()
   rather than embedding the property name (free text from an
   uploaded CSV, so it can contain quotes/apostrophes) directly into
   an onclick string -- avoids a whole class of quoting bugs.
   ============================================================ */
async function lookupSiteAssignments(){
  const w = state.wizard;
  const props = currentProperties();
  if(!props.length) return;
  w.siteAssignLoading = true; render();
  const sites = props.map(p => ({ key:p.key, city:p.city, state:p.state }));
  try {
    const [ahjRes, regionRes] = await Promise.all([
      workerFetch('/api/ahj/suggest-batch', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ sites }) }),
      workerFetch('/api/region/suggest-batch', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ sites }) }),
    ]);
    const ahjData = await ahjRes.json();
    const regionData = await regionRes.json();
    state.wizard.siteAhjSuggestions = ahjRes.ok ? (ahjData.results||{}) : {};
    state.wizard.siteRegionSuggestions = regionRes.ok ? (regionData.results||{}) : {};
  } catch(e){
    showToast('Could not reach the server for AHJ/region lookup.', true);
  }
  state.wizard.siteAssignLoading = false;
  render();
}
function confirmSiteAhj(idx, ahjId){
  const p = currentProperties()[idx]; if(!p) return;
  setWizard({ siteAhj: { ...state.wizard.siteAhj, [p.key]: ahjId } });

function confirmSiteAhjSuggested(idx){
  const p = currentProperties()[idx]; if(!p) return;

}
function confirmSiteRegion(idx, region){

}
function confirmSiteRegionSuggested(idx){

}
function confirmAllSiteSuggestions(){
  const props = currentProperties();
  const w = state.wizard;
  const nextAhj = { ...w.siteAhj }, nextRegion = { ...w.siteRegion };
  for(const p of props){
    const aSug = w.siteAhjSuggestions[p.key];
    if(aSug && aSug.match && !nextAhj[p.key]) nextAhj[p.key] = aSug.match.id;

// Shared by both offer types -- li is the 'inspection' lineItem from the
// cached pricing response (see renderServicePricingCard). isPortfolio
// picks between the two detail shapes computeOfferTotals() returns for
// this service (see its per_ahj_category branch): single carries one
// yearBreakdown with per-category itemization; portfolio carries perSite
// results that get summed here into a portfolio-wide per-year total (the
// finer per-property-per-category breakout is the still-separate,
// not-yet-built "Inspection CAT breakout" backup-detail item).
function renderInspectionPricingDetail(li, termYears, isPortfolio){
  if(!li || !li.detail){
    return `<div class="notional-banner" style="margin-top:10px;"><span class="ic">${icon('warn')}</span>Calculating…</div>`;
  }
  const d = li.detail;
  const placeholderNote = d.isPlaceholder
    ? `<div class="notional-banner" style="margin-top:10px;"><span class="ic">${icon('warn')}</span>${isPortfolio?'One or more matched regions use':'This region uses'} a placeholder (not-yet-vetted) rate — treat this total as notional.</div>`
    : '';
  if(isPortfolio){
    const n = d.termYears || termYears || 1;
    const years = Array.from({length:n}, (_, i) => ({
      year: i+1,
      amount: (d.perSite||[]).reduce((a,s) => a + (s.yearBreakdown && s.yearBreakdown[i] ? s.yearBreakdown[i].amount : 0), 0),
    }));
    const unresolvedCount = (d.perSite||[]).filter(s=>s.unresolved).length;
    return placeholderNote + `
    ${unresolvedCount>0 ? `<div class="notional-banner" style="margin-top:10px;"><span class="ic">${icon('warn')}</span>${unresolvedCount} propert${unresolvedCount===1?'y':'ies'} not yet confirmed — excluded from this total.</div>` : ''}
    <div class="table-card" style="margin-top:10px;">
      <table class="data-table rc-table">

// Print-to-PDF via the browser's native print dialog: isolate the target
// document element with a class the print stylesheet (see
// "@media print" in the <style> block) makes visible while everything
// else is hidden, then invoke window.print(). No new libraries -- the
// user chooses "Save as PDF" in their browser's print destination
// picker, same mechanism most lightweight web apps use for this.
function downloadDocumentPDF(elementId){
  document.querySelectorAll('.print-target').forEach(el => el.classList.remove('print-target'));
  const el = document.getElementById(elementId);
  if(!el){ showToast('Could not find that document to print.', true); return; }
  el.classList.add('print-target');
  window.print();
}
async function confirmGenerateOffer(){
  const w = state.wizard;
  if(w.generating) return; // guard against a double-click double-creating the offer
  if(!w.pricingResult){ showToast('Pricing is still loading — wait a moment and try again.', true); return; }
  w.generating = true; render();

  const units = currentUnits();
  const body = {
    clientName: w.clientName,
    portfolioName: w.offerType==='single' ? null : w.portfolioName,
    offerType: w.offerType,
    siteCount: w.offerType==='single' ? 1 : new Set(units.map(u=>u.property)).size,
    unitCount: units.length,
    contractTermYears: w.contractTermYears,
    totals: computeOfferTotals(),
    deliverables: w.deliverables,
    // Same portfolio-only rule as refreshPricing() -- see comment there.
    discountTiers: w.offerType === 'portfolio' ? w.discountTiers : [],
  };
  try {
    const res = await workerFetch('/api/offers', {
      method: 'POST', headers: { 'Content-Type':'application/json' }, body: JSON.stringify(body),
    });
    const data = await res.json();
    if(!res.ok){ showToast(data.error || 'Could not save this offer.', true); w.generating = false; render(); return; }
    showToast(`Offer ${data.id} created.`);
    setState({ view:'offer-detail', activeOfferId:data.id, offerDetail:data });
  } catch(e){
    showToast('Could not reach the server. Check your connection and try again.', true);
    w.generating = false; render();
  }
}

async function ensureTravelAdminNames(){
  if(!currentUser || currentUser.role !== 'admin') return;
  const w = state.wizard;
  if(w.travelAdminNamesLoaded) return;
  const sites = (w.offerType === 'single'
    ? [{ key:'single', city:w.city, state:w.siteState }]
    : currentProperties().map(p => ({ key:p.key, city:p.city, state:p.state })))
    .filter(s => s.city && s.state)
    .map(s => ({ ...s, types:['consultant'] }));
  if(!sites.length) return;
  w.travelAdminNamesLoaded = true; // set before the await -- avoids duplicate concurrent fetches on re-render
  try {
    const res = await workerFetch('/api/personnel/nearest-batch', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ sites }),
    });
    const data = await res.json();
    if(res.ok){
      const names = {};
      for(const [key, r] of Object.entries(data.results||{})){
        if(r && r.consultant && r.consultant.name) names[key] = r.consultant;
      }
      state.wizard.travelAdminNames = names;
      render();
    }
  } catch(e){ /* falls back to anonymized code below -- not fatal */ }
}
