/* ============================================================
   RATE CARDS (admin only) — reads and writes the REAL rate card, live,
   through the Worker. No table is ever cached client-side as the
   source of truth: every value shown here comes straight from
   /api/admin/rate-cards, and every edit PATCHes
   /api/admin/rate-cards/:id/cell and re-fetches. This replaces a
   previous version of this screen that edited a local JS object
   seeded from a plaintext rate table baked into this file -- that
   table doesn't exist in this file anymore, on purpose.
   ============================================================ */
async function loadRateCardData(){
  try {
    const res = await workerFetch('/api/admin/rate-cards');
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'Could not load rate cards.');
    state.rateCardData = data;
  } catch(e){
    state.rateCardData = { error: e.message || 'Could not load rate cards.' };
  }
  render();
}
// v2i fix: this function used to always coerce `value` with Number(),
// which is correct for the price/rate_factor/markup_factor fields every
// prior caller used, but silently corrupts a text field -- Number(
// "Annual") and Number("some note text") are both NaN. Governance's
// frequency and notes fields (added this update) are the first
// non-numeric callers, which surfaced this. Fields that should stay
// numeric are named explicitly; everything else is sent as-is (already
// a string, or already a real 0/1 number for `required`, which needs
// no comma-stripping).
const RATE_CARD_NUMERIC_FIELDS = ['price', 'base_rate', 'rate_factor', 'price_per_unit', 'is_placeholder', 'required', 'included_contractors', 'markup_per_unit'];
async function updateRateCardCellLive(table, id, field, value){
  const rateCardId = state.rateCardData.rateCard.id;
  // Dollar-amount cells are comma-formatted text inputs (see
  // formatCurrencyInput/currencyInputToNumber below) -- strip commas
  // before parsing, or Number("2,200") silently becomes NaN and the
  // save would corrupt the stored price. Plain number inputs (the
  // decimal rate/markup factors) pass through unaffected since they
  // never contain a comma to begin with. Non-numeric fields (frequency,
  // notes) are sent through unchanged.
  const finalValue = RATE_CARD_NUMERIC_FIELDS.includes(field)
    ? Number(String(value).replace(/,/g, ''))
    : value;
  try {
    const res = await workerFetch(`/api/admin/rate-cards/${rateCardId}/cell`, {
      method: 'PATCH', headers: { 'Content-Type':'application/json' },
      body: JSON.stringify({ table, id: Number(id), field, value: finalValue }),
    });
    const data = await res.json();
    if(!res.ok){ showToast(data.error || 'Could not save that change.', true); return; }
    showToast('Saved.');
    loadRateCardData();
  } catch(e){
    showToast('Could not reach the server.', true);
  }
}

/* ============================================================
   BULK % RATE INCREASE (Batch D, 2026-08-28) -- per-tab, with a
   required preview step before commit, per Misty's confirmed design
   (see the Worker's matching comment for the full design record).
   Two-call shape mirrors the Worker: previewBulkIncrease() is
   read-only and safe to call repeatedly; commitBulkIncrease() is the
   one call that writes, and is only reachable from the preview screen
   (never directly from the % input) so there's no path that skips
   seeing old->new values first.
   ============================================================ */
function openBulkIncrease(tabId){
  setState({ bulkIncrease: { tabId, pct: '', preview: null, loading: false, error: null } });
}
function closeBulkIncrease(){
  setState({ bulkIncrease: null });
}
function updateBulkIncreasePct(val){
  if(!state.bulkIncrease) return;
  setState({ bulkIncrease: { ...state.bulkIncrease, pct: val, preview: null, error: null } });
}
async function requestBulkIncreasePreview(){
  const bi = state.bulkIncrease;
  if(!bi) return;
  const pct = Number(bi.pct);
  if(!bi.pct || isNaN(pct)){
    setState({ bulkIncrease: { ...bi, error: 'Enter a percentage first.' } });
    return;
  }
  setState({ bulkIncrease: { ...bi, loading: true, error: null } });
  try {
    const rateCardId = state.rateCardData.rateCard.id;
    const res = await workerFetch(`/api/admin/rate-cards/${rateCardId}/bulk-increase-preview`, {
      method: 'POST', headers: { 'Content-Type':'application/json' },
      body: JSON.stringify({ tabId: bi.tabId, pctIncrease: pct }),
    });
    const data = await res.json();
    if(!res.ok){ setState({ bulkIncrease: { ...state.bulkIncrease, loading: false, error: data.error || 'Could not compute a preview.' } }); return; }
    setState({ bulkIncrease: { ...state.bulkIncrease, loading: false, preview: data, error: null } });
  } catch(e){
    setState({ bulkIncrease: { ...state.bulkIncrease, loading: false, error: 'Could not reach the server.' } });
  }
}
async function commitBulkIncrease(){
  const bi = state.bulkIncrease;
  if(!bi || !bi.preview) return;
  setState({ bulkIncrease: { ...bi, loading: true, error: null } });
  try {
    const rateCardId = state.rateCardData.rateCard.id;
    const res = await workerFetch(`/api/admin/rate-cards/${rateCardId}/bulk-increase-commit`, {
      method: 'POST', headers: { 'Content-Type':'application/json' },
      body: JSON.stringify({ tabId: bi.tabId, pctIncrease: Number(bi.pct) }),
    });
    const data = await res.json();
    if(!res.ok){ setState({ bulkIncrease: { ...state.bulkIncrease, loading: false, error: data.error || 'Could not apply the increase.' } }); return; }
    showToast(`Applied +${bi.pct}% to ${data.rowCount} rate${data.rowCount===1?'':'s'}. Effective date now ${data.newEffectiveDate}.`);
    setState({ bulkIncrease: null });
    loadRateCardData();
  } catch(e){
    setState({ bulkIncrease: { ...state.bulkIncrease, loading: false, error: 'Could not reach the server.' } });
  }
}

// Live comma-formatting for editable dollar-amount cells (Rate Cards
// price grids). Applied on every keystroke via oninput -- strips
// anything non-numeric, re-inserts thousands separators, and restores
// cursor position so typing in the middle of a number doesn't jump the
// caret to the end (a common bug with naive reformat-on-input).
function formatCurrencyInput(el){
  const raw = el.value;
  const cursorFromEnd = raw.length - el.selectionStart;
  const digitsOnly = raw.replace(/[^\d.]/g, '');
  const parts = digitsOnly.split('.');
  const intPart = parts[0].replace(/^0+(?=\d)/, '');
  const formatted = (intPart === '' ? '0' : Number(intPart).toLocaleString('en-US')) + (parts.length > 1 ? '.' + parts[1].slice(0,2) : '');
  el.value = formatted;
  const newPos = Math.max(0, formatted.length - cursorFromEnd);
  el.setSelectionRange(newPos, newPos);
}
function currencyInputToNumber(str){ return Number(String(str).replace(/,/g, '')) || 0; }

   rate-card edit in this app (PATCH by row id).

const GOV_FREQUENCIES = ['6 months', 'Annual', '2 years', '3 years', '5 years'];
function toggleGovernanceExpanded(ahjId){

function renderInspectionGovernanceLive(authorities, ahjRequirements, inspectionCategories){
  const search = (state.inspectionGovSearch || '').trim().toLowerCase();
  // Washington D.C. display-only rename (Task #24): before the real
  // rename ran in D1, this row's jurisdiction_name/state were literally
  // "DC" -- this mapped ONLY the label shown here, never the underlying
  // id/state text used for matching/lookups/API calls. Task #24 has
  // since renamed the real row to "Washington D.C." directly, so this
  // condition is now a no-op fallback (kept in case an unmigrated/cached
  // copy of the row ever shows up) rather than the active code path --
  // safe to remove entirely once the rename is confirmed live everywhere.
  const displayName = ahj => ahj.jurisdiction_name === 'DC' && ahj.state === 'DC' ? 'Washington D.C.' : ahj.jurisdiction_name;

  const states = (authorities||[]).filter(a=>a.is_state_level===1 || a.is_state_level===true)
    .slice()
    .sort((a,b)=>displayName(a).localeCompare(displayName(b)));
  const childrenOf = stateAhj => (authorities||[]).filter(a=>
    a.state===stateAhj.state && a.id!==stateAhj.id && !(a.is_state_level===1 || a.is_state_level===true)
  ).sort((a,b)=>displayName(a).localeCompare(displayName(b)));

  // v2i (uncheck wiring): a row can now exist with required=0 -- a
  // soft-flagged/previously-unchecked category, kept around (with its
  // frequency/notes intact) so re-checking restores it instantly
  // instead of losing that data. reqFor() returns ANY row regardless of
  // required, since govNotesCell/re-check need to see it; "checked" for
  // display/logic purposes is specifically required===1.
  const reqFor = (ahjId, catId) => (ahjRequirements||[]).find(r=>r.ahj_id===ahjId && r.category_id===catId);
  const isRequired = req => !!req && (req.required===1 || req.required===true);

  function govCell(ahj, cat){
    const req = reqFor(ahj.id, cat.id);
    const checked = isRequired(req);
    const selId = `govfreq_${ahj.id}_${cat.id}`;
    return `
    <td class="ir-gov-cell">
      <div class="ir-gov-cell-inner">
        <label class="ir-gov-chk-wrap">
          <span class="chk ${checked?'checked':''}" onclick="toggleGovernanceRequirement('${escapeHtml(ahj.id)}','${cat.id}', ${req ? req.id : 'null'}, ${checked})">${checked?'✓':''}</span>
        </label>
        <select class="ir-gov-freq-select" id="${selId}" ${checked?'':'disabled'}
          onchange="updateGovernanceFrequency(${req ? req.id : 'null'}, '${escapeHtml(ahj.id)}', '${cat.id}', this.value)">
          <option value="" disabled ${checked?'':'selected'}>Select…</option>
          ${GOV_FREQUENCIES.map(f=>`<option value="${f}" ${checked && req.frequency===f ? 'selected':''}>${f}</option>`).join('')}
        </select>
      </div>
    </td>`;
  }
  function govNotesCell(ahj, cats){
    // Notes is per-AHJ in the UI (one free-text column per row) but the
    // data model stores notes per (ahj, category) row -- follow the
    // mockup's own convention of showing whichever requirement row for
    // this AHJ already carries note text (the seeded data always puts
    // the same note on every required category for a given AHJ), and
    // wire edits to whichever row is checked first if none carry a note
    // yet. If no row exists at all for this AHJ, notes has nowhere to
    // save yet -- shown as a disabled placeholder, same convention as
    // an unmatched rate-card cell.
    // Prefer a currently-required row so notes attach to an active
    // category first; only fall back to a soft-unchecked (required=0)
    // row if nothing active exists yet for this AHJ.
    const allReqs = cats.map(c=>reqFor(ahj.id, c.id)).filter(Boolean);
    const activeReqs = allReqs.filter(isRequired);
    const withNote = activeReqs.find(r=>r.notes) || allReqs.find(r=>r.notes);
    const target = withNote || activeReqs[0] || allReqs[0];
    if(!target){
      return `<td class="ir-gov-notes-cell ir-gov-notes-empty">—</td>`;
    }
    return `<td class="ir-gov-notes-cell"><input class="text-input" type="text" value="${escapeHtml(target.notes||'')}" placeholder="—"
      onchange="updateRateCardCellLive('ahj_inspection_requirements','${target.id}','notes',this.value)"></td>`;
  }

  function renderStateRow(ahj, children){
    const hasChildren = children.length>0;
    const expanded = state.governanceExpanded.has(ahj.id);
    return `
    <tr class="ir-gov-parent-row">
      <td class="ir-gov-name-cell">
        <div style="display:flex; align-items:center; gap:6px;">

          <span class="row-title">${escapeHtml(displayName(ahj))}</span>
        </div>
      </td>
      ${inspectionCategories.map(cat=>govCell(ahj, cat)).join('')}
      ${govNotesCell(ahj, inspectionCategories)}
    </tr>
    ${hasChildren ? `<tbody class="ir-gov-children" style="${expanded?'':'display:none;'}">
      ${children.map(child => `
      <tr class="ir-gov-child-row">
        <td class="ir-gov-name-cell">
          <div style="display:flex; align-items:center; gap:6px; padding-left:24px;">
            <span style="font-size:12px; color:var(--text-secondary);">${escapeHtml(displayName(child))}</span>
          </div>
        </td>
        ${inspectionCategories.map(cat=>govCell(child, cat)).join('')}
        ${govNotesCell(child, inspectionCategories)}
      </tr>`).join('')}
    </tbody>` : ''}`;
  }

  const visibleStates = states.filter(s => {
    if(!search) return true;
    if(displayName(s).toLowerCase().includes(search)) return true;
    return childrenOf(s).some(c=>displayName(c).toLowerCase().includes(search));
  });

  return `
  <div class="mk-section">
    <p class="card-title" style="margin-bottom:2px;">Inspection Governance</p>
    <p class="row-sub" style="margin:2px 0 12px 0; max-width:760px;">AHJ required inspection categories and frequency. Checking a category enables its frequency dropdown adjacent to the checkbox.</p>
    <div class="ir-toolbar-row" style="margin-bottom:12px;">
      <div class="ir-search-wrap">
        <i class="ti ti-search"></i>
        <input type="text" class="text-input ir-search-input" placeholder="Search jurisdiction…" value="${escapeHtml(state.inspectionGovSearch||'')}" oninput="setState({inspectionGovSearch:this.value})">
      </div>
      <button class="btn btn-sm" onclick="openAddAhj()">${icon('plus')} Add AHJ</button>
    </div>
    <div class="table-scroll">
      <table class="ir-gov-table">
        <thead><tr>
          <th>Jurisdiction</th>
          ${inspectionCategories.map(c=>`<th>${escapeHtml(c.name)}</th>`).join('')}
          <th class="ir-notes-header">Notes</th>

    </div>
  </div>`;
}

// Checking a box with no existing ahj_inspection_requirements row
// creates one (POST /inspection-requirement); unchecking a box DELETES
// nothing today -- there is no delete route for this table (out of
// scope for this pass, matching the task's instruction to design the
// create-vs-patch split deliberately rather than fake it -- delete
// would need its own reviewed decision about whether unchecking should
// hard-delete history or just flip `required`, and is left for a
// follow-up rather than guessed here). So unchecking an already-
// checked box is a no-op for now other than a toast explaining why.
// v2i: unchecking soft-flags (required=0) rather than deleting -- the
// row's frequency/notes stay in place so re-checking restores them
// instantly instead of losing what was entered. See the continuity
// brief's uncheck-behavior decision. A row with no existing id yet
// (never checked before) still goes through the create route on first
// check; every subsequent toggle on that same (ahj, category) is a
// plain required 1/0 PATCH via the existing updateRateCardCellLive path.
async function toggleGovernanceRequirement(ahjId, categoryId, existingReqId, currentlyChecked){
  if(existingReqId){
    updateRateCardCellLive('ahj_inspection_requirements', existingReqId, 'required', currentlyChecked ? 0 : 1);
    return;
  }
  const rateCardId = state.rateCardData.rateCard.id;
  try {
    const res = await workerFetch(`/api/admin/rate-cards/${rateCardId}/inspection-requirement`, {
      method: 'POST', headers: { 'Content-Type':'application/json' },
      body: JSON.stringify({ ahjId, categoryId, frequency: null, notes: null }),
    });
    const data = await res.json();
    if(!res.ok){ showToast(data.error || 'Could not save that change.', true); return; }
    showToast('Saved. Choose a frequency to finish.');
    loadRateCardData();
  } catch(e){
    showToast('Could not reach the server.', true);
  }
}
// Setting the frequency dropdown on a just-created row (no id yet, the
// select is disabled until checked -- see govCell -- but this also
// covers the create-then-immediately-set-frequency path from a fresh
// checkbox click) vs. an existing row (plain PATCH via the same
// updateRateCardCellLive pattern every other rate-card edit uses).
async function updateGovernanceFrequency(existingReqId, ahjId, categoryId, frequency){
  if(existingReqId){
    updateRateCardCellLive('ahj_inspection_requirements', existingReqId, 'frequency', frequency);

  const rateCardId = state.rateCardData.rateCard.id;
  try {
    const res = await workerFetch(`/api/admin/rate-cards/${rateCardId}/inspection-requirement`, {
      method: 'POST', headers: { 'Content-Type':'application/json' },
      body: JSON.stringify({ ahjId, categoryId, frequency, notes: null }),
    });
    const data = await res.json();
    if(!res.ok){ showToast(data.error || 'Could not save that change.', true); return; }
    showToast('Saved.');
    loadRateCardData();
  } catch(e){
    showToast('Could not reach the server.', true);
  }
}

/* ============================================================
   "+ Add Region" (Inspection Rate Card) — small inline .modal.narrow
   form, same state-driven show/close/submit pattern as
   openCreateUser/closeCreateUser/submitCreateUser above. On submit:
   POST /inspection-region first (registers the row on the rate card
   grid with zero price cells -- see createInspectionRegion's Worker
   comment); if "also create a matching AHJ" was checked, a second POST
   to /authority follows, using a slugified id derived from the typed
   jurisdiction name with isStateLevel:true (a brand-new top-level
   jurisdiction has no parent state to nest under yet, so it's
   state-level by definition -- matches the task's explicit design call).
   ============================================================ */
// Shared slugification for the admin-supplied AHJ id -- lowercase,
// non-alphanumeric runs collapse to a single underscore, trimmed of
// leading/trailing underscores, prefixed ahj_. Matches the real
// ahj_<lowercase_snake_case> convention confirmed live (e.g.
// ahj_colorado_douglas_county) closely enough for a first-cut id; an
// admin who wants a different id can't override it from this form (out
// of scope here, matching the task brief's "slugified id derived from
// the jurisdiction name" instruction) but the Worker's createAuthority
// still validates the final id against the real convention either way.
function slugifyAhjId(name){
  const slug = String(name||'').trim().toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
  return `ahj_${slug}`;
}
function openAddRegion(){
  state.addRegionError = null;
  state.addRegionBusy = false;
  state.addRegionJurisdictionDefault = '';
  state.showAddRegion = true;
  render();
}
function closeAddRegion(){ state.showAddRegion = false; state.addRegionError = null; render(); }
// Keeps the AHJ jurisdiction-name field in sync with the region name as
// it's typed, WITHOUT a full render() on every keystroke (which would
// steal focus from the region-name input the admin is actively typing
// in) -- writes straight to the DOM element instead, same technique
// formatCurrencyInput already uses for live-editing inputs in this file.
function onAddRegionNameInput(value){
  const jurisdictionInput = document.getElementById('newRegionJurisdictionName');
  // Only auto-fill while the admin hasn't diverged the jurisdiction
  // field from the default themselves -- tracked via addRegionJurisdictionDefault,
  // which is only ever set here, never by user edits to that field.
  if(jurisdictionInput && jurisdictionInput.value === (state.addRegionJurisdictionDefault||'')){
    jurisdictionInput.value = value;
  }
  state.addRegionJurisdictionDefault = value;
}
async function submitAddRegion(){
  const region = document.getElementById('newRegionName').value.trim();
  const makeAhj = document.getElementById('newRegionMakeAhj').checked;
  const jurisdictionName = document.getElementById('newRegionJurisdictionName').value.trim();
  if(!region){ state.addRegionError = 'Region name is required.'; render(); return; }
  if(makeAhj && !jurisdictionName){ state.addRegionError = 'AHJ jurisdiction name is required when creating a matching AHJ.'; render(); return; }
  state.addRegionBusy = true; render();
  const rateCardId = state.rateCardData.rateCard.id;
  try {
    const res = await workerFetch(`/api/admin/rate-cards/${rateCardId}/inspection-region`, {
      method: 'POST', headers: { 'Content-Type':'application/json' },
      body: JSON.stringify({ region }),
    });
    const data = await res.json();
    if(!res.ok){ state.addRegionBusy = false; state.addRegionError = data.error || 'Could not create that region.'; render(); return; }

    let ahjNote = '';
    if(makeAhj){
      const ahjId = slugifyAhjId(jurisdictionName);
      const ahjRes = await workerFetch(`/api/admin/rate-cards/${rateCardId}/authority`, {
        method: 'POST', headers: { 'Content-Type':'application/json' },
        body: JSON.stringify({ id: ahjId, state: jurisdictionName, jurisdictionName, isStateLevel: true }),
      });
      const ahjData = await ahjRes.json();
      state.addRegionBusy = false;
      if(!ahjRes.ok){
        // The region itself was created successfully -- only the AHJ
        // half failed (e.g. id collision). Close the modal since the
        // primary action succeeded, but surface the AHJ failure as its
        // own toast rather than silently dropping it.
        state.showAddRegion = false; state.addRegionError = null;
        showToast(`Region "${region}" created, but the matching AHJ could not be created: ${ahjData.error || 'unknown error'}`, true);
        loadRateCardData();
        return;
      }
      ahjNote = ` and AHJ "${jurisdictionName}"`;
    } else {
      state.addRegionBusy = false;
    }
    state.showAddRegion = false; state.addRegionError = null;
    showToast(`Region "${region}"${ahjNote} created.`);
    loadRateCardData();
  } catch(e){
    state.addRegionBusy = false;
    state.addRegionError = 'Could not reach the server. Check your connection and try again.'; render();
  }
}

async function submitAddAhj(){
  const jurisdictionName = document.getElementById('newAhjJurisdictionName').value.trim();
  const stateVal = document.getElementById('newAhjState').value.trim();
  const isStateLevel = document.getElementById('newAhjIsStateLevel').checked;
  if(!jurisdictionName){ state.addAhjError = 'Jurisdiction name is required.'; render(); return; }
  if(!stateVal){ state.addAhjError = 'State is required.'; render(); return; }
  state.addAhjBusy = true; render();
  const rateCardId = state.rateCardData.rateCard.id;
  const ahjId = slugifyAhjId(jurisdictionName);
  try {
    const res = await workerFetch(`/api/admin/rate-cards/${rateCardId}/authority`, {
      method: 'POST', headers: { 'Content-Type':'application/json' },
      body: JSON.stringify({ id: ahjId, state: stateVal, jurisdictionName, isStateLevel }),
    });
    const data = await res.json();
    state.addAhjBusy = false;
    if(!res.ok){ state.addAhjError = data.error || 'Could not create that AHJ.'; render(); return; }
    state.showAddAhj = false; state.addAhjError = null;
    showToast(`AHJ "${jurisdictionName}" created.`);
    loadRateCardData();
  } catch(e){
    state.addAhjBusy = false;
    state.addAhjError = 'Could not reach the server. Check your connection and try again.'; render();
  }
}

async function changeOfferStatus(id, status){
  try {
    const res = await workerFetch(`/api/offers/${id}/status`, {
      method: 'PATCH', headers: { 'Content-Type':'application/json' }, body: JSON.stringify({ status }),
    });
    if(!res.ok){ const data = await res.json().catch(()=>({})); showToast(data.error || 'Could not update status.', true); return; }
    showToast(`Status updated to ${offerStatusLabel(status)}.`);
    loadOfferDetail(id);
  } catch(e){
    showToast('Could not reach the server.', true);
  }
}
let deleteOfferTargetId = null;
function openDeleteOffer(id, client, status){
  deleteOfferTargetId = id;
  state.deleteOfferClient = client;
  state.deleteOfferStatus = status;
  state.deleteOfferError = null;
  state.deleteOfferBusy = false;
  state.showDeleteOffer = true;
  render();
}
function closeDeleteOffer(){ deleteOfferTargetId = null; state.showDeleteOffer = false; state.deleteOfferError = null; render(); }
async function submitDeleteOffer(){
  state.deleteOfferBusy = true; render();
  try {
    const res = await workerFetch(`/api/offers/${deleteOfferTargetId}`, { method: 'DELETE' });
    const data = await res.json().catch(()=>({}));
    state.deleteOfferBusy = false;
    if(!res.ok){ state.deleteOfferError = data.error || 'Could not delete this offer.'; render(); return; }
    const clientName = state.deleteOfferClient;
    state.showDeleteOffer = false; state.deleteOfferError = null;
    showToast(`Offer for ${clientName} deleted.`);
    goTo('offers');
    loadOffers();
  } catch(e){
    state.deleteOfferBusy = false;
    state.deleteOfferError = 'Could not reach the server. Check your connection and try again.'; render();
  }
}

/* ============================================================
   PRICING ANALYTICS (admin) — aggregate rollups computed from the OFFERS
   roster: pipeline by status, by owner, by offer type. All real math over
   the seed data (no fabricated trend lines / forecasts).
   ============================================================ */
function renderAdmin(){
  const byStatus = {};
  ['draft','sent','accepted','expired'].forEach(s => byStatus[s] = OFFERS.filter(o=>o.status===s));
  const totalValue = OFFERS.reduce((a,o)=>a+o.total,0);
  const acceptedValue = byStatus.accepted.reduce((a,o)=>a+o.total,0);
  const resolvedCount = byStatus.accepted.length + byStatus.expired.length;
  const winRate = resolvedCount ? Math.round(100*byStatus.accepted.length/resolvedCount) : 0;

  const owners = [...new Set(OFFERS.map(o=>o.owner))];
  const byOwner = owners.map(name => {
    const rows = OFFERS.filter(o=>o.owner===name);
    return { name, count: rows.length, value: rows.reduce((a,o)=>a+o.total,0) };
  }).sort((a,b)=>b.value-a.value);

  const portfolioCount = OFFERS.filter(o=>o.type==='portfolio').length;
  const singleCount = OFFERS.filter(o=>o.type==='single').length;
  const maxStatusVal = Math.max(...Object.values(byStatus).map(rows=>rows.reduce((a,o)=>a+o.total,0)), 1);

  return `
  <div class="page-topline">PULSE Pricing</div>
  <div class="page-header-row">
    <div>
      <h1 class="page-title">Pricing Analytics</h1>
      <p class="page-sub">Admin rollup across ${OFFERS.length} offers · internal tool, not client-facing</p>
    </div>
  </div>

  <div class="stat-row">
    <div class="stat-tile">
      <div class="top-row"><span class="label">Total pipeline value</span><span class="icon-chip">$</span></div>
      <div class="value">${fmtMoney(totalValue)}</div>
      <div class="caption">across ${OFFERS.length} offers</div>
    </div>
    <div class="stat-tile">
      <div class="top-row"><span class="label">Accepted value</span><span class="icon-chip">${icon('check')}</span></div>
      <div class="value">${fmtMoney(acceptedValue)}</div>
      <div class="caption">${byStatus.accepted.length} accepted offer${byStatus.accepted.length!==1?'s':''}</div>
    </div>
    <div class="stat-tile">
      <div class="top-row"><span class="label">Win rate</span><span class="icon-chip">%</span></div>
      <div class="value">${winRate}%</div>
      <div class="caption">accepted vs. resolved (accepted + expired)</div>
    </div>
    <div class="stat-tile">
      <div class="top-row"><span class="label">Portfolio vs. single</span><span class="icon-chip">${icon('clients')}</span></div>
      <div class="value">${portfolioCount} / ${singleCount}</div>
      <div class="caption">portfolio offers vs. single-property</div>
    </div>
  </div>

  <div class="two-col">
    <div class="card card-pad">
      <p class="card-title" style="margin-bottom:14px;">Pipeline value by status</p>
      <div style="display:flex; flex-direction:column; gap:12px;">
        ${['draft','sent','accepted','expired'].map(s => {
          const rows = byStatus[s]; const val = rows.reduce((a,o)=>a+o.total,0);
          const pct = Math.round(100*val/maxStatusVal);
          return `<div>
            <div class="kv-row" style="margin-bottom:5px;"><span class="k">${statusPill(s)} <span style="margin-left:6px;">${rows.length} offer${rows.length!==1?'s':''}</span></span><span class="v">${fmtMoney(val)}</span></div>
            <div style="background:var(--gray-100); border-radius:6px; height:8px; overflow:hidden;"><div style="width:${pct}%; height:100%; background:var(--blue);"></div></div>
          </div>`;
        }).join('')}
      </div>
    </div>
    <div class="card card-pad">
      <p class="card-title" style="margin-bottom:12px;">By pricing administrator</p>
      <div class="kv-list">
        ${byOwner.map(o => `<div class="kv-row"><span class="k">${escapeHtml(o.name)} <span style="color:var(--text-muted);">(${o.count})</span></span><span class="v">${fmtMoney(o.value)}</span></div>`).join('')}
      </div>
    </div>
  </div>`;
}

   PERSONNEL ROSTER (admin only) — ported from the former standalone
   personnel_admin.html. Upload a roster .xlsx -> real SheetJS parse in
   the browser -> review -> confirm -> import via the Worker. Nothing is
   sent to the server until "Confirm & Import" is clicked. Real names
   are only ever visible here, in an admin session -- the public-facing
   "closest consultant/inspector" feature only returns an anonymous
   code + distance to non-admin sessions.
   ============================================================ */
const REQUIRED_PERSONNEL_HEADERS = [
  'Legal First Name',
  'Legal Last Name',
  'Legal / Preferred Address: City',
  'Legal / Preferred Address: State / Territory Code',
  'Home Department Description',
  'Job Function Description',
];
const FIELD_JOB_FUNCTIONS = { consultant: 'Consultant', inspector: 'Field Examiner' };
let stagedPersonnelRows = null;

async function loadImportHistory(){
  try {
    const res = await workerFetch('/api/admin/personnel/import-history');
    const data = await res.json();
    state.importHistory = res.ok ? data : { error: true };
  } catch(e){
    state.importHistory = { error: true };
  }
  render();
}
function setImportType(type){
  state.importType = type;
  stagedPersonnelRows = null;
  state.importReview = null;
  state.importResult = null;
  render();
}
function parsePersonnelFile(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, { type: 'array', cellDates: true });
        const ws = wb.Sheets[wb.SheetNames[0]];
        resolve(XLSX.utils.sheet_to_json(ws, { defval: '', cellDates: true }));
      } catch (err) { reject(err); }
    };
    reader.onerror = () => reject(reader.error);
    reader.readAsArrayBuffer(file);
  });
}
async function handlePersonnelFile(fileInput){
  const file = fileInput.files && fileInput.files[0];
  if(!file) return;
  try {
    const rows = await parsePersonnelFile(file);
    if(!rows.length){ showToast('That file has no data rows.', true); return; }
    const headers = Object.keys(rows[0]);
    const missing = REQUIRED_PERSONNEL_HEADERS.filter(h => !headers.includes(h));
    if(missing.length){ showToast('Unexpected file format — missing column(s): ' + missing.join(', '), true); return; }
    stagedPersonnelRows = rows;
    const fieldFn = FIELD_JOB_FUNCTIONS[state.importType];
    let totalField = 0, totalNonField = 0;
    rows.forEach(row => { if(row['Job Function Description'] === fieldFn) totalField++; else totalNonField++; });
    state.importReview = { rows: rows.slice(0, 20), fieldFn, totalField, totalNonField, total: rows.length };
    state.importResult = null;
    render();
  } catch(err){
    showToast('Could not read that file — confirm it is a valid .xlsx export', true);
  }
}
async function confirmPersonnelImport(){
  if(!stagedPersonnelRows) return;
  state.importSubmitting = true; render();
  try {
    const res = await workerFetch('/api/admin/personnel/import', {
      method: 'POST', headers: { 'Content-Type':'application/json' },
      body: JSON.stringify({ type: state.importType, rows: stagedPersonnelRows }),
    });
    const data = await res.json();
    if(!res.ok){ showToast(data.error || 'Import failed', true); return; }
    state.importResult = data;
    state.importReview = null;
    stagedPersonnelRows = null;
    showToast(`Imported ${data.importedCount} ${state.importType} record(s).`);
    loadImportHistory();
  } catch(e){
    showToast('Import failed — check your connection and try again.', true);
  } finally {
    state.importSubmitting = false; render();
  }
}

              return `<tr>

            }).join('')}

  ${result ? `

        <div class="stat-tile"><div class="label">Geocode failures</div><div class="value ${result.geocodeFailures?'warn':''}">${result.geocodeFailures}</div></div>

/* ============================================================
   MANAGE USERS (admin only) — ported from the former standalone
   personnel_admin.html. Create/edit/deactivate accounts and assign
   roles (admin | sales). Role is a server-verified fact
   looked up at login, never a client-side choice.
   ============================================================ */
function roleLabel(role){ return { admin: 'Admin', sales: 'Sales' }[role] || role; }

async function loadUsers(){
  try {
    const res = await workerFetch('/api/admin/users');
    if(!res.ok) throw new Error('load failed');
    state.usersData = await res.json();
  } catch(e){
    state.usersData = { error: true };
  }
  render();
}
function openCreateUser(){ state.showCreateUser = true; render(); }
function closeCreateUser(){ state.showCreateUser = false; state.createUserError = null; render(); }
async function submitCreateUser(){
  const name = document.getElementById('newUserName').value.trim();
  const email = document.getElementById('newUserEmail').value.trim();
  const role = document.getElementById('newUserRole').value;
  if(!name){ state.createUserError = 'Name is required.'; render(); return; }
  if(!email){ state.createUserError = 'Email is required — the initial PIN is emailed, not typed in here.'; render(); return; }
  try {
    const res = await workerFetch('/api/admin/users', {
      method: 'POST', headers: { 'Content-Type':'application/json' },
      body: JSON.stringify({ name, email, role }),
    });
    const data = await res.json();
    if(!res.ok){ state.createUserError = data.error || 'Could not create user.'; render(); return; }
    state.showCreateUser = false; state.createUserError = null;
    if(data.emailed){
      showToast(`${data.user.name} created as ${roleLabel(data.user.role)} — PIN emailed to ${data.user.email}.`);
    } else {
      // Email genuinely failed to send (bad Resend config, API error,
      // etc) -- the account and its PIN still exist, so hand the admin
      // the PIN directly rather than leaving them with a locked-out user
      // and no way to get them in.
      state.fallbackPinNotice = { name: data.user.name, pin: data.fallbackPin, reason: data.emailError };
    }
    loadUsers();
  } catch(e){
    state.createUserError = 'Could not reach the server. Check your connection and try again.'; render();
  }
}
let editUserTargetId = null;
function openEditUser(id, name, email){
  editUserTargetId = id;
  state.editUserName = name;
  state.editUserEmail = email;
  state.editUserError = null;
  state.editUserBusy = false;
  state.showEditUser = true;
  render();
}
function closeEditUser(){ editUserTargetId = null; state.showEditUser = false; state.editUserError = null; render(); }
async function submitEditUser(){
  const name = document.getElementById('editUserName').value.trim();
  const email = document.getElementById('editUserEmail').value.trim();
  if(!name){ state.editUserError = 'Name is required.'; render(); return; }
  if(!email){ state.editUserError = 'Email is required.'; render(); return; }
  state.editUserBusy = true; render();
  try {
    const res = await workerFetch(`/api/admin/users/${editUserTargetId}`, {
      method: 'PATCH', headers: { 'Content-Type':'application/json' }, body: JSON.stringify({ name, email }),
    });
    const data = await res.json();
    state.editUserBusy = false;
    if(!res.ok){ state.editUserError = data.error || 'Could not save changes.'; render(); return; }
    state.showEditUser = false; state.editUserError = null;
    showToast(`${data.name} updated.`);
    loadUsers();
  } catch(e){
    state.editUserBusy = false;
    state.editUserError = 'Could not reach the server. Check your connection and try again.'; render();
  }
}
async function changeUserRole(id, role, selectEl){
  // data-prev is set at render time and only updated on a CONFIRMED
  // change below -- selectEl.value at this point is already the NEW
  // (possibly-about-to-fail) value, so it must never be used as the
  // fallback to revert to.
  const previousValue = selectEl.getAttribute('data-prev');
  try {
    const res = await workerFetch(`/api/admin/users/${id}`, {
      method: 'PATCH', headers: { 'Content-Type':'application/json' }, body: JSON.stringify({ role }),
    });
    const data = await res.json();
    if(!res.ok){ showToast(data.error || 'Could not change role.', true); selectEl.value = previousValue; return; }
    selectEl.setAttribute('data-prev', role);
    showToast(`${data.name} is now ${roleLabel(data.role)}.`);
  } catch(e){
    showToast('Could not reach the server.', true); selectEl.value = previousValue;
  }
}
async function toggleUserActive(id, nextActiveStr){
  const nextActive = nextActiveStr === 'true';
  try {
    const res = await workerFetch(`/api/admin/users/${id}`, {
      method: 'PATCH', headers: { 'Content-Type':'application/json' }, body: JSON.stringify({ active: nextActive }),
    });
    const data = await res.json();
    if(!res.ok){ showToast(data.error || 'Could not update user.', true); return; }
    showToast(`${data.name} ${nextActive ? 'activated' : 'deactivated'}.`);
    loadUsers();
  } catch(e){
    showToast('Could not reach the server.', true);
  }
}
let resetPinTargetId = null;
function openResetPin(id, name){
  resetPinTargetId = id;
  state.resetPinName = name;
  state.resetPinError = null;
  state.resetPinBusy = false;
  state.showResetPin = true;
  render();
}
function closeResetPin(){ resetPinTargetId = null; state.showResetPin = false; render(); }
// Single action now -- the server generates the new PIN and emails it,
// the admin never types one in. Reset PIN (from the modal, with a
// confirmation step since it force-signs the user out) and Resend PIN
// (a one-click retry when a user says they never got their email) call
// the same two server routes, which run identical logic -- see the
// Worker's resetUserPin() comment.
async function sendNewPin(userId, { isResend } = {}){
  try {
    const res = await workerFetch(`/api/admin/users/${userId}/${isResend ? 'resend-pin' : 'reset-pin'}`, {
      method: 'POST', headers: { 'Content-Type':'application/json' },
    });
    const data = await res.json();
    if(!res.ok){ return { ok:false, error: data.error || 'Could not send PIN.' }; }
    return { ok:true, emailed: data.emailed, emailError: data.emailError, fallbackPin: data.fallbackPin };
  } catch(e){
    return { ok:false, error: 'Could not reach the server. Check your connection and try again.' };
  }
}
async function submitResetPin(){
  state.resetPinBusy = true; render();
  const targetName = state.resetPinName;
  const result = await sendNewPin(resetPinTargetId, { isResend:false });
  state.resetPinBusy = false;
  if(!result.ok){ state.resetPinError = result.error; render(); return; }
  state.showResetPin = false; state.resetPinError = null;
  if(result.emailed){
    showToast(`New PIN emailed to ${targetName}. They've been signed out everywhere.`);
  } else {
    state.fallbackPinNotice = { name: targetName, pin: result.fallbackPin, reason: result.emailError };
  }
  render();
}
async function resendPin(userId, name){
  showToast(`Sending a new PIN to ${name}…`);
  const result = await sendNewPin(userId, { isResend:true });
  if(!result.ok){ showToast(result.error, true); return; }
  if(result.emailed){
    showToast(`New PIN emailed to ${name}. They've been signed out everywhere.`);
  } else {
    state.fallbackPinNotice = { name, pin: result.fallbackPin, reason: result.emailError };
    render();
  }
}
function closeFallbackPinNotice(){ state.fallbackPinNotice = null; render(); }
let deleteUserTargetId = null;
function openDeleteUser(id, name){
  deleteUserTargetId = id;
  state.deleteUserName = name;
  state.deleteUserOfferCount = 0;
  state.deleteUserError = null;
  state.deleteUserBusy = false;
  state.showDeleteUser = true;
  render();
}
function closeDeleteUser(){ deleteUserTargetId = null; state.showDeleteUser = false; state.deleteUserError = null; render(); }
async function submitDeleteUser(){
  // First call (no reassignOffersTo) either succeeds outright, or -- if
  // the user owns offers -- the Worker responds 400 with offerCount. That
  // response re-renders THIS SAME modal with the reassignment picker
  // added, rather than opening a second modal, per the two-step-in-place
  // pattern. Once a target is picked, the modal is resubmitted with
  // reassignOffersTo set and the delete proceeds for real.
  const reassignSelect = document.getElementById('deleteUserReassignTo');
  const reassignOffersTo = reassignSelect ? reassignSelect.value : null;
  if(state.deleteUserOfferCount && !reassignOffersTo){
    state.deleteUserError = 'Pick an admin to reassign these offers to.'; render(); return;
  }
  state.deleteUserBusy = true; render();
  try {
    const res = await workerFetch(`/api/admin/users/${deleteUserTargetId}`, {
      method: 'DELETE', headers: { 'Content-Type':'application/json' },
      body: JSON.stringify(reassignOffersTo ? { reassignOffersTo } : {}),
    });
    const data = await res.json();
    state.deleteUserBusy = false;
    if(!res.ok){
      if(data.offerCount){
        // Not actually an error state -- surface the reassignment step.
        state.deleteUserOfferCount = data.offerCount; state.deleteUserError = null; render(); return;
      }
      state.deleteUserError = data.error || 'Could not delete this user.'; render(); return;
    }
    const deletedName = state.deleteUserName;
    state.showDeleteUser = false; state.deleteUserError = null;
    showToast(data.reassignedOfferCount ? `${deletedName} deleted — ${data.reassignedOfferCount} offer${data.reassignedOfferCount!==1?'s':''} reassigned.` : `${deletedName} deleted.`);
    loadUsers();
  } catch(e){
    state.deleteUserBusy = false;
    state.deleteUserError = 'Could not reach the server. Check your connection and try again.'; render();
  }
}

function renderPlaceholder(title){
  return `
  <div class="page-topline">PULSE Pricing</div>
  <h1 class="page-title">${title}</h1>
  <div class="empty-state card" style="margin-top:20px;">
    <div class="ic">⚙</div>
    This view is being built in the next pass.
  </div>`;
}

/* ============================================================
   ROOT RENDER
   ============================================================ */
function render(){
  // render() always replaces the ENTIRE #root innerHTML below -- this is
  // the app's core render pattern, used by every view. That means every
  // call destroys and recreates every DOM node, including whatever input
  // the user is actively typing in, which drops browser focus even
  // though the typed value is preserved correctly in state. This first
  // surfaced as "only lets me type a single letter at a time" (v1j,
  // fixed in v1k by debouncing the render call on Step 1's text fields)
  // -- but a debounce only delays the same DOM teardown; it still lands
  // mid-typing at any natural pause (confirmed 2026-08-26: hitting
  // spacebar between words was enough to trigger it), so that was a
  // patch, not the real fix. The real fix: capture which element has
  // focus (and its cursor/selection) right before the rebuild, then
  // restore both right after -- so a render is safe to fire on every
  // keystroke, on any timing, with no visible interruption at all.
  // Only works for elements with a stable `id` (see the Step 1 fields
  // in renderWizardStep1... — id lookup is how we find "the same"
  // element again after it's been torn down and recreated); an element
  // with no id just silently isn't restored, same as before this existed.
  const prevActive = document.activeElement;
  const prevActiveId = (prevActive && prevActive.id) ? prevActive.id : null;
  let prevSelStart = null, prevSelEnd = null;
  if(prevActiveId){
    try { prevSelStart = prevActive.selectionStart; prevSelEnd = prevActive.selectionEnd; } catch(e){ /* selectionStart/End throws on some input types (e.g. type=number) -- just skip cursor restore for those, focus restore below still works */ }
  }

  const isAdmin = currentUser && currentUser.role === 'admin';
  let body = '';
  if(state.view === 'offers') body = renderOffersRoster();
  else if(state.view === 'wizard') body = renderWizard();
  else if(state.view === 'offer-detail') body = renderOfferDetail();
  else if(state.view === 'ratecard' && isAdmin) body = renderRateCards();
  else if(state.view === 'clients') body = renderClientsSites();
  else if(state.view === 'admin' && isAdmin) body = renderAdmin();
  else if(state.view === 'personnel' && isAdmin) body = renderPersonnelRoster();
  else if(state.view === 'users' && isAdmin) body = renderManageUsers();
  else if(['ratecard','admin','personnel','users'].includes(state.view)) body = renderPlaceholder('Not available');
  else body = renderPlaceholder(state.view);

  document.getElementById('root').innerHTML = `
    <div class="app-shell">
      ${renderSidebar()}
      <div class="main">${body}</div>
    </div>
    ${state.toast ? `<div class="toast-wrap"><div class="toast ${state.toast.isError?'error':''}">${escapeHtml(state.toast.msg)}</div></div>` : ''}
  `;

  if(prevActiveId){
    const restored = document.getElementById(prevActiveId);
    if(restored && typeof restored.focus === 'function'){
      restored.focus();
      if(prevSelStart != null && prevSelEnd != null && typeof restored.setSelectionRange === 'function'){
        try { restored.setSelectionRange(prevSelStart, prevSelEnd); } catch(e){ /* not a text-selectable input type -- focus above still applied */ }
      }
    }
  }
}
// No initial render() call -- #root stays hidden until doLogin()
// succeeds and calls render() itself, OR tryRestoreSession() below finds
// and restores a still-valid session from an earlier login in this same
// tab (see the SESSION PERSISTENCE comment near workerFetch() for the
// full reasoning). Nothing in this app renders before a real session
// exists either way -- login screen is what's visible by default in the
// HTML, and only one of these two paths ever hides it.
window.addEventListener('load', () => { tryRestoreSession(); });
</script>
