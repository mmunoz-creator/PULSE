<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="PULSE Platform Hub - Sign in">
  <title>PULSE | Sign In</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23052242'/%3E%3Cpath d='M16 34h9l5-16 7 29 5-20h7' fill='none' stroke='%233a9cff' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    :root{--navy:#072746;--navy-deep:#031b30;--ink:#092544;--blue:#2f96f4;--blue-soft:#80c9ff;--line:#d9e4ef;--muted:#64768b;--white:#fff;--shadow:0 12px 34px rgba(11,48,80,.10);--ease:cubic-bezier(.22,1,.36,1)}
    *{box-sizing:border-box}html{min-width:320px;background:var(--navy-deep)}body{margin:0;color:var(--ink);font-family:"Avenir Next",Avenir,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}button,input{font:inherit}button{cursor:pointer}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .brand{display:inline-flex;align-items:center;gap:.34em;color:currentColor;font-size:2rem;font-weight:500;letter-spacing:.36em;line-height:1;text-decoration:none}.brand-icon{flex:none;width:1.1em;height:1.1em;display:grid;place-items:center;border-radius:.27em;background:linear-gradient(135deg,#185FA5,#378ADD)}.brand-icon svg{width:62%;height:62%;stroke:#fff}
    .login-view{min-height:100svh;position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(390px,33vw);align-items:center;gap:clamp(2rem,5vw,6rem);padding:clamp(2.5rem,6vw,6rem) clamp(2rem,7vw,7rem);color:var(--white);background:#0a2945 url("/assets/login-city-sunrise.png") center 62%/cover no-repeat;isolation:isolate;overflow:hidden}.login-view::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(2,19,35,.72) 0%,rgba(2,24,43,.36) 43%,rgba(3,18,30,.12) 70%,rgba(3,18,30,.28) 100%),linear-gradient(0deg,rgba(2,15,27,.32),transparent 46%)}.login-story{min-height:min(780px,calc(100svh - 6rem));display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;max-width:760px}.login-brand .brand{font-size:clamp(2rem,2.8vw,3.35rem)}.brand-line{margin-top:1.2rem;font-size:.72rem;font-weight:600;letter-spacing:.43em;text-transform:uppercase}.login-copy{margin:auto 0;padding:4rem 0}.login-copy h1{max-width:760px;margin:0 0 1.35rem;font-size:clamp(3rem,5vw,5.3rem);font-weight:350;letter-spacing:-.045em;line-height:1.04;text-wrap:balance}.login-copy p{max-width:660px;margin:0;color:rgba(255,255,255,.88);font-size:clamp(1.1rem,1.55vw,1.48rem);line-height:1.55}.elevating{font-size:.72rem;font-weight:650;letter-spacing:.48em;text-transform:uppercase}
    .login-card{width:100%;max-width:460px;justify-self:end;padding:clamp(2rem,3vw,2.75rem);color:var(--ink);background:rgba(255,255,255,.93);border:1px solid rgba(255,255,255,.75);border-radius:17px;box-shadow:0 28px 70px rgba(0,16,30,.32);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}.login-card h2{margin:0 0 .25rem;font-size:1.85rem;letter-spacing:-.035em}.login-card>p{margin:0 0 2rem;color:var(--muted);font-size:1.04rem}.field{margin-bottom:1.3rem}.field label{display:block;margin-bottom:.48rem;font-size:.9rem;font-weight:700}.input-wrap{position:relative}.field input{width:100%;min-height:50px;padding:0 1rem;color:var(--ink);background:rgba(255,255,255,.82);border:1px solid #b8c7d5;border-radius:7px;outline:none;transition:border-color .2s,box-shadow .2s,background .2s}.field input:focus{background:#fff;border-color:var(--blue);box-shadow:0 0 0 4px rgba(47,150,244,.14)}.input-wrap input{padding-right:3.2rem}.eye-btn{position:absolute;top:50%;right:.75rem;width:34px;height:34px;transform:translateY(-50%);border:0;border-radius:50%;color:#61758a;background:transparent}.eye-btn:hover{background:#edf5fc}.forgot{display:block;width:max-content;margin:-.55rem 0 1.45rem auto;color:#0876df;font-size:.88rem;text-decoration:none}.forgot:hover{text-decoration:underline}.primary-btn{width:100%;min-height:53px;border-radius:7px;transition:transform .18s var(--ease),box-shadow .18s,border-color .18s;display:flex;align-items:center;justify-content:center;gap:.85rem;color:#fff;border:1px solid #0b3a65;background:linear-gradient(110deg,#082e52,#0a4678);box-shadow:0 8px 18px rgba(5,51,90,.18)}.primary-btn:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(5,51,90,.27)}.primary-btn[disabled]{opacity:.7;cursor:default;transform:none!important}.login-note{min-height:1.25rem;margin:1rem 0 -1rem;color:#49677f;font-size:.84rem;text-align:center}
    .toast{position:fixed;left:50%;bottom:1.6rem;z-index:100;padding:.8rem 1.1rem;color:#fff;background:#082d50;border-radius:8px;box-shadow:var(--shadow);opacity:0;visibility:hidden;transform:translate(-50%,14px);transition:.25s}.toast.show{opacity:1;visibility:visible;transform:translate(-50%,0)}
    @media(max-width:1180px){.login-view{grid-template-columns:1fr minmax(370px,42%);padding-left:4vw;padding-right:4vw}}
    @media(max-width:880px){.login-view{display:flex;flex-direction:column;align-items:stretch;justify-content:center;gap:2rem;padding:2rem;background-position:center}.login-story{min-height:auto;max-width:none}.login-brand{margin-bottom:clamp(6rem,18vh,11rem)}.login-copy{padding:0}.login-copy h1{font-size:clamp(2.65rem,9vw,4.6rem)}.elevating{display:none}.login-card{align-self:flex-end;max-width:500px}}
    @media(max-width:640px){.login-view{justify-content:flex-start;padding:1.5rem 1rem 2rem;background-position:58% center}.login-view::before{background:linear-gradient(180deg,rgba(2,18,32,.44),rgba(2,18,32,.76))}.login-brand{margin-bottom:4.5rem;padding:.35rem .25rem}.brand-line{letter-spacing:.28em;font-size:.6rem}.login-copy{margin-bottom:1rem;padding:0 .25rem}.login-copy h1{font-size:2.55rem}.login-copy p{font-size:1rem}.login-card{padding:1.6rem 1.25rem;border-radius:13px}.login-card h2{font-size:1.55rem}.login-card>p{margin-bottom:1.45rem}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <section class="login-view" aria-labelledby="login-title">
    <div class="login-story">
      <div class="login-brand"><a class="brand" href="/login/" aria-label="PULSE home"><span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3 8l4 -16l3 8h4"/></svg></span><span>PULSE</span></a><div class="brand-line">People&nbsp;&nbsp;|&nbsp;&nbsp;Insight&nbsp;&nbsp;|&nbsp;&nbsp;Progress</div></div>
      <div class="login-copy"><h1>Greater Perspective.<br>Higher Impact.</h1><p>Integrated intelligence for a stronger,<br>safer, and more valuable built world.</p></div>
      <div class="elevating">Elevating What's Next</div>
    </div>
    <form class="login-card" id="loginForm"><h2 id="login-title">Welcome to PULSE</h2><p>Sign in to access your platforms.</p><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" placeholder="name@company.com" autocomplete="email" required></div><div class="field"><label for="password">Password</label><div class="input-wrap"><input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required><button class="eye-btn" id="eyeBtn" type="button" aria-label="Show password"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2.5 12s3.5-5.5 9.5-5.5 9.5 5.5 9.5 5.5-3.5 5.5-9.5 5.5S2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.6"/></svg></button></div></div><a class="forgot" href="#" id="forgotLink">Forgot password?</a><button class="primary-btn" type="submit" id="signInBtn"><span>Sign In</span><span aria-hidden="true">⟶</span></button><div class="login-note" id="loginNote" aria-live="polite"></div></form>
  </section>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    (()=>{
      const form=document.getElementById('loginForm'),email=document.getElementById('email'),password=document.getElementById('password'),eye=document.getElementById('eyeBtn'),note=document.getElementById('loginNote'),signInBtn=document.getElementById('signInBtn'),forgotLink=document.getElementById('forgotLink'),toast=document.getElementById('toast');
      let timer;
      const showToast=message=>{toast.textContent=message;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),2400)};

      // NOTE: this is a front-end shell only. There is no real credential
      // check here yet, real authentication/session (SSO) is a separate,
      // not-yet-built phase. Any well-formed email/password combination is
      // accepted so the Hub experience can be reviewed and used today.
      // We remember what was typed (client-side only, this browser tab)
      // purely so the Hub screen can greet the right person by name.
      form.addEventListener('submit',event=>{
        event.preventDefault();
        if(!form.reportValidity())return;
        signInBtn.setAttribute('disabled','');
        note.textContent='Opening your PULSE Hub…';
        const addr=email.value.trim();
        const namePart=addr.split('@')[0].replace(/[._-]+/g,' ').trim();
        const displayName=namePart?namePart.replace(/\b\w/g,c=>c.toUpperCase()):addr;
        const initials=(displayName.match(/\b\w/g)||['P']).slice(0,2).join('').toUpperCase();
        try{
          sessionStorage.setItem('pulse_hub_display_name',displayName);
          sessionStorage.setItem('pulse_hub_initials',initials);
          sessionStorage.setItem('pulse_hub_email',addr);
        }catch(e){}
        setTimeout(()=>{window.location.href='/home/'},420);
      });

      eye.addEventListener('click',()=>{const showing=password.type==='text';password.type=showing?'password':'text';eye.setAttribute('aria-label',showing?'Show password':'Hide password')});
      forgotLink.addEventListener('click',event=>{event.preventDefault();showToast('Password recovery is not yet connected.')});
    })();
  </script>
</body>
</html>
