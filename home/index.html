<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="PULSE Platform Hub">
  <title>PULSE | Platform Hub</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23052242'/%3E%3Cpath d='M16 34h9l5-16 7 29 5-20h7' fill='none' stroke='%233a9cff' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    :root{--navy:#072746;--navy-deep:#031b30;--ink:#092544;--blue:#2f96f4;--blue-soft:#80c9ff;--line:#d9e4ef;--muted:#64768b;--white:#fff;--shadow:0 12px 34px rgba(11,48,80,.10);--ease:cubic-bezier(.22,1,.36,1)}
    *{box-sizing:border-box}html{min-width:320px;background:#fff}body{margin:0;color:var(--ink);font-family:"Avenir Next",Avenir,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}button,input{font:inherit}button{cursor:pointer}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .brand{display:inline-flex;align-items:center;gap:.34em;color:currentColor;font-size:2rem;font-weight:500;letter-spacing:.36em;line-height:1;text-decoration:none}.brand-icon{flex:none;width:1.1em;height:1.1em;display:grid;place-items:center;border-radius:.27em;background:linear-gradient(135deg,#185FA5,#378ADD)}.brand-icon svg{width:62%;height:62%;stroke:#fff}
    .hub-view{min-height:100svh;background:#fff}.hub-header{height:68px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 clamp(1.5rem,3.2vw,3.6rem);border-bottom:1px solid #d8e1ea;background:rgba(255,255,255,.96);position:sticky;top:0;z-index:20}.hub-header .brand{font-size:1.58rem;justify-self:start}.main-nav{align-self:stretch;display:flex;gap:clamp(1.4rem,3.2vw,3.7rem)}.main-nav button{position:relative;padding:0 .2rem;color:#596d83;border:0;background:transparent;font-size:.9rem}.main-nav button:hover,.main-nav button.active{color:var(--ink)}.main-nav button.active{font-weight:700}.main-nav button.active::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--blue)}.profile{justify-self:end;position:relative}.profile-trigger{display:flex;align-items:center;gap:.75rem;padding:.35rem;color:var(--ink);border:0;background:transparent;border-radius:99px}.profile-trigger:hover{background:#f0f6fb}.avatar{display:grid;place-items:center;width:42px;height:42px;color:#fff;background:var(--navy);border-radius:50%;font-size:.82rem}.profile-name{font-size:.9rem;font-weight:600}.chevron{width:8px;height:8px;border-right:1.5px solid;border-bottom:1.5px solid;transform:rotate(45deg) translateY(-2px)}.profile-menu{position:absolute;right:0;top:54px;width:180px;padding:.45rem;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);opacity:0;visibility:hidden;transform:translateY(-5px);transition:.18s}.profile.open .profile-menu{opacity:1;visibility:visible;transform:none}.profile-menu button{width:100%;padding:.7rem .8rem;color:var(--ink);text-align:left;border:0;border-radius:7px;background:transparent}.profile-menu button:hover{background:#eef6fc}
    .hub-main{min-height:calc(100svh - 68px);display:grid;grid-template-columns:minmax(0,58%) minmax(500px,42%)}.hub-hero{position:relative;min-height:760px;padding:clamp(3rem,5vw,5rem) clamp(2.4rem,5vw,5.6rem) 2.1rem;display:flex;flex-direction:column;color:#fff;background:#0d3455 url("/assets/vision-city-skyline.png") center/cover no-repeat;isolation:isolate}.hub-hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(4,30,55,.34),rgba(4,30,55,.03) 40%,rgba(2,20,38,.88) 100%),linear-gradient(90deg,rgba(4,28,50,.24),transparent 70%)}.welcome h1{margin:0 0 .35rem;font-size:clamp(2rem,3.2vw,3.35rem);font-weight:400;letter-spacing:-.035em}.welcome p{margin:0;color:rgba(255,255,255,.82);font-size:clamp(1.05rem,1.55vw,1.35rem)}.welcome-rule{width:65px;height:3px;margin-top:1.8rem;background:#55b4ff}.hub-hero-bottom{margin-top:auto;max-width:660px}.hub-hero-bottom h2{margin:0 0 .85rem;font-size:clamp(2.3rem,4.1vw,4.1rem);line-height:1.02;letter-spacing:-.045em}.hub-hero-bottom h2 span{color:var(--blue-soft)}.hub-hero-bottom>p{max-width:620px;margin:0;color:rgba(255,255,255,.9);font-size:clamp(1rem,1.3vw,1.2rem);line-height:1.52}.quick-links{display:grid;grid-template-columns:repeat(4,1fr);margin-top:2.6rem}.quick-link{display:flex;align-items:center;gap:.75rem;min-height:48px;padding:0 1rem;color:#fff;border:0;border-left:1px solid rgba(255,255,255,.42);background:transparent;text-align:left}.quick-link:first-child{border-left:0;padding-left:0}.quick-link:hover{color:var(--blue-soft)}.quick-link svg{flex:none;width:29px;height:29px}.quick-link span{font-size:.82rem;white-space:nowrap}
    .platform-pane{padding:clamp(2.2rem,3.6vw,3.8rem) clamp(1.65rem,3.2vw,3.3rem);background:radial-gradient(circle at 100% 0%,#e6f5ff 0,transparent 35%),linear-gradient(135deg,#fbfdff,#f5faff)}.platform-pane h2{margin:0 0 1.2rem .35rem;font-size:clamp(1.75rem,2.25vw,2.25rem);letter-spacing:-.035em}.platform-list{display:grid;gap:14px}.platform-card{min-height:126px;display:grid;grid-template-columns:29% 1fr auto;align-items:center;overflow:hidden;color:var(--ink);background:#fff;border:1px solid rgba(219,231,241,.88);border-radius:12px;box-shadow:0 8px 24px rgba(15,55,90,.075);text-decoration:none;transition:transform .25s var(--ease),box-shadow .25s,border-color .25s}.platform-card:hover,.platform-card:focus-visible{transform:translateY(-4px);border-color:#9bcdf7;box-shadow:0 16px 32px rgba(15,55,90,.14);outline:none}.platform-card.is-locked{cursor:default;opacity:.62}.platform-card.is-locked:hover{transform:none;box-shadow:0 8px 24px rgba(15,55,90,.075);border-color:rgba(219,231,241,.88)}.platform-photo{width:100%;height:100%;min-height:126px;object-fit:cover}.platform-info{min-width:0;display:grid;grid-template-columns:54px 1fr;align-items:center;gap:.9rem;padding:1rem 1.25rem}.platform-icon{width:48px;height:48px;color:#0a3762}.platform-copy h3{margin:0 0 .35rem;font-size:clamp(.96rem,1.1vw,1.12rem);letter-spacing:.14em}.platform-copy p{margin:0;color:#687c91;font-size:.96rem;line-height:1.42}.platform-copy .status-note{display:block;margin-top:.3rem;font-size:.76rem;font-weight:700;letter-spacing:.08em;color:var(--blue);text-transform:uppercase}.card-arrow{display:grid;place-items:center;width:50px;height:50px;margin-right:1.35rem;color:#07365f;background:#ecf7ff;border:1px solid #acd8fa;border-radius:50%;font-size:1.65rem;transition:.22s var(--ease)}.platform-card:hover .card-arrow{color:#fff;background:var(--blue);border-color:var(--blue);transform:translateX(3px)}.platform-card.is-locked .card-arrow{color:#9aabbc;background:#eef2f6;border-color:#d9e2ea}.platform-card.is-locked:hover .card-arrow{background:#eef2f6;border-color:#d9e2ea;color:#9aabbc;transform:none}.toast{position:fixed;left:50%;bottom:1.6rem;z-index:100;padding:.8rem 1.1rem;color:#fff;background:#082d50;border-radius:8px;box-shadow:var(--shadow);opacity:0;visibility:hidden;transform:translate(-50%,14px);transition:.25s}.toast.show{opacity:1;visibility:visible;transform:translate(-50%,0)}
    @media(max-width:1180px){.hub-main{grid-template-columns:52% 48%}.hub-hero{padding-left:2.6rem;padding-right:2.6rem}.platform-pane{padding-left:1.5rem;padding-right:1.5rem}.platform-card{grid-template-columns:27% 1fr auto}.platform-info{grid-template-columns:42px 1fr;gap:.65rem;padding:.8rem}.platform-icon{width:39px;height:39px}.card-arrow{width:43px;height:43px;margin-right:.8rem}.quick-link{padding:0 .6rem;gap:.5rem}}
    @media(max-width:880px){.hub-header{grid-template-columns:auto 1fr auto}.main-nav{justify-self:center}.hub-main{display:block}.hub-hero{min-height:690px}.platform-pane{padding:3rem 1.5rem 4rem}.platform-card{min-height:120px}}
    @media(max-width:640px){.hub-header{height:62px;padding:0 1rem}.hub-header .brand{font-size:1.18rem}.main-nav{display:none}.profile-name{display:none}.avatar{width:38px;height:38px}.hub-main{min-height:calc(100svh - 62px)}.hub-hero{min-height:600px;padding:2.4rem 1.25rem 1.5rem;background-position:center}.welcome h1{font-size:2.25rem}.hub-hero-bottom h2{font-size:2.55rem}.quick-links{grid-template-columns:1fr 1fr;gap:.35rem 0;margin-top:1.8rem}.quick-link{border-left:0;padding:.35rem 0}.platform-pane{padding:2.5rem .85rem 3rem}.platform-pane h2{margin-left:.15rem;font-size:1.75rem}.platform-list{gap:10px}.platform-card{grid-template-columns:92px 1fr 40px;min-height:108px;border-radius:10px}.platform-photo{min-height:108px}.platform-info{display:block;padding:.8rem .75rem}.platform-icon{display:none}.platform-copy h3{font-size:.82rem;letter-spacing:.1em}.platform-copy p{font-size:.8rem}.card-arrow{width:36px;height:36px;margin-right:.5rem;font-size:1.2rem}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <section class="hub-view" aria-labelledby="hub-title">
    <header class="hub-header">
      <a class="brand" href="/home/" aria-label="PULSE home"><span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3 8l4 -16l3 8h4"/></svg></span><span>PULSE</span></a>
      <nav class="main-nav" aria-label="Primary navigation"><button class="active" type="button">Home</button><button type="button" data-message="Resources selected.">Resources</button><button type="button" data-message="Support selected.">Support</button></nav>
      <div class="profile" id="profile">
        <button class="profile-trigger" id="profileTrigger" type="button" aria-expanded="false"><span class="avatar" id="avatarInitials">P</span><span class="profile-name" id="profileName">Welcome</span><span class="chevron" aria-hidden="true"></span></button>
        <div class="profile-menu" aria-label="Profile menu"><button type="button" data-message="Profile selected.">Your Profile</button><button id="logoutBtn" type="button">Sign Out</button></div>
      </div>
    </header>
    <main class="hub-main">
      <section class="hub-hero" aria-labelledby="welcome-heading">
        <div class="welcome"><h1 id="welcome-heading">Welcome back.</h1><p id="welcomeSub">Choose a PULSE platform to get started.</p><div class="welcome-rule"></div></div>
        <div class="hub-hero-bottom">
          <h2>Better Buildings.<br><span>Brighter Possibilities.</span></h2>
          <p>One connected platform for strategy, pricing,<br>modernization, and inspection intelligence.</p>
          <div class="quick-links" aria-label="Quick links">
            <button class="quick-link" type="button" data-message="Learning Center selected."><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 6c5-1 9 0 12 3v18c-3-3-7-4-12-3zM28 6c-5-1-9 0-12 3v18c3-3 7-4 12-3z"/></svg><span>Learning Center</span></button>
            <button class="quick-link" type="button" data-message="What's New selected."><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 3h13l5 5v21H8zM21 3v6h6M12 15h10M12 20h10M12 25h7"/></svg><span>What's New</span></button>
            <button class="quick-link" type="button" data-message="Support selected."><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 18v-3a11 11 0 0 1 22 0v3M5 18h5v8H7a2 2 0 0 1-2-2zM27 18h-5v8h3a2 2 0 0 0 2-2zM22 27c-2 2-5 2-7 2"/></svg><span>Get Support</span></button>
            <button class="quick-link" type="button" data-message="Profile selected."><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="16" cy="10" r="6"/><path d="M5 29c1-8 5-11 11-11s10 3 11 11z"/></svg><span>Your Profile</span></button>
          </div>
        </div>
      </section>
      <section class="platform-pane" aria-labelledby="hub-title">
        <h2 id="hub-title">Your PULSE Platforms</h2>
        <div class="platform-list" id="platformList"></div>
      </section>
    </main>
  </section>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    // Single source of truth for every platform tile. To add a new
    // platform later (the two more you're planning), add one entry here,
    // nothing else on this page needs to change.
    //
    //   key          short id, used for the DOM only
    //   name         shown as the card title (auto-uppercased by CSS-free markup below, so type it as you want it displayed)
    //   tagline      short two-part line under the title
    //   href         where the card goes. Use a real URL for a live platform.
    //                Leave as null for a platform that isn't live yet: the
    //                card renders "locked" and shows a status note instead.
    //   status       optional short label shown when href is null, e.g. "Coming soon"
    //   photo        path under /assets/
    //   icon         inline SVG path data (viewBox 0 0 54 54)
    const PLATFORMS = [
      {
        key: 'strategy',
        name: 'PULSE STRATEGY',
        tagline: 'Insight today. Advantage tomorrow.',
        href: 'https://elevatorpulse.com/strategy',
        photo: '/assets/strategy-connected-city.png',
        photoAlt: 'Connected city skyline at blue hour',
        icon: '<path d="m5 43 15-28 9 16 7-13 13 25zM20 15l9 16"/>'
      },
      {
        key: 'pricing',
        name: 'PULSE PRICING',
        tagline: 'Smarter pricing. Stronger performance.',
        href: 'https://elevatorpulse.com/pricing',
        photo: '/assets/pricing-architectural-fins.png',
        photoAlt: 'Architectural fins reaching toward the sky',
        icon: '<path d="M7 45V31h9v14M22 45V20h9v25M37 45V8h9v37M4 45h45"/>'
      },
      {
        key: 'modernization',
        name: 'PULSE MODERNIZATION',
        tagline: 'Portfolio visibility. Project assurance.',
        href: '/modernization/',
        photo: '/assets/modernization-green-property.png',
        photoAlt: 'Modern sustainable commercial property',
        icon: '<path d="m6 19 21-12 21 12-21 12zM6 29l21 12 21-12M6 39l21 12 21-12"/>'
      },
      {
        key: 'inspections',
        name: 'PULSE INSPECTIONS',
        tagline: 'Compliance clarity. Confidence at every property.',
        href: null,
        status: 'Coming soon',
        photo: '/assets/inspections-elevator-review.png',
        photoAlt: 'Professional reviewing an elevator inspection',
        icon: '<rect x="10" y="10" width="34" height="39" rx="3"/><path d="M21 10V6h12v4M18 22h18M18 31h18M18 40h12M15 22h.01M15 31h.01M15 40h.01"/>'
      }
      // Add future platforms here, for example:
      // { key:'newthing', name:'PULSE NEWTHING', tagline:'...', href:null, status:'Coming soon', photo:'/assets/placeholder.png', photoAlt:'...', icon:'<path d="..."/>' }
    ];

    (()=>{
      const profile=document.getElementById('profile'),profileTrigger=document.getElementById('profileTrigger'),toast=document.getElementById('toast'),list=document.getElementById('platformList');
      let timer;
      const showToast=message=>{toast.textContent=message;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),2400)};

      // Greeting/avatar comes from what was typed at /login/ (client-side
      // only, no real session yet). If someone lands here directly without
      // going through /login/ first, fall back to a generic greeting.
      let displayName='',initials='P';
      try{
        displayName=sessionStorage.getItem('pulse_hub_display_name')||'';
        initials=sessionStorage.getItem('pulse_hub_initials')||'P';
      }catch(e){}
      document.getElementById('welcome-heading').textContent = displayName ? `Welcome back, ${displayName}.` : 'Welcome.';
      document.getElementById('profileName').textContent = displayName || 'Your Profile';
      document.getElementById('avatarInitials').textContent = initials;

      list.innerHTML = PLATFORMS.map(p=>{
        const locked = !p.href;
        const tag = locked ? 'div' : 'a';
        const hrefAttr = locked ? '' : ` href="${p.href}"`;
        const statusNote = locked ? `<span class="status-note">${p.status||'Coming soon'}</span>` : '';
        return `<${tag} class="platform-card${locked?' is-locked':''}"${hrefAttr} data-platform="${p.name}" data-locked="${locked}">
          <img class="platform-photo" src="${p.photo}" alt="${p.photoAlt||''}">
          <div class="platform-info">
            <svg class="platform-icon" viewBox="0 0 54 54" fill="none" stroke="currentColor" stroke-width="2.2">${p.icon}</svg>
            <div class="platform-copy"><h3>${p.name}</h3><p>${p.tagline}${statusNote}</p></div>
          </div>
          <span class="card-arrow" aria-hidden="true">→</span>
        </${tag}>`;
      }).join('');

      list.querySelectorAll('.platform-card.is-locked').forEach(card=>{
        card.addEventListener('click',()=>showToast(`${card.dataset.platform} is not available yet.`));
      });

      profileTrigger.addEventListener('click',event=>{event.stopPropagation();const open=profile.classList.toggle('open');profileTrigger.setAttribute('aria-expanded',String(open))});
      document.addEventListener('click',()=>{profile.classList.remove('open');profileTrigger.setAttribute('aria-expanded','false')});
      document.getElementById('logoutBtn').addEventListener('click',()=>{
        try{sessionStorage.removeItem('pulse_hub_display_name');sessionStorage.removeItem('pulse_hub_initials');sessionStorage.removeItem('pulse_hub_email');}catch(e){}
        window.location.href='/login/';
      });
      document.querySelectorAll('[data-message]').forEach(item=>item.addEventListener('click',event=>{event.preventDefault();showToast(item.dataset.message)}));
    })();
  </script>
</body>
</html>
